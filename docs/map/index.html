.","dfr":"Acte juridique ou publication qui modifie le texte d'un instrument et produit une nouvelle version à compter d'une date donnée.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000509","en":"regulatory change","fr":"changement réglementaire","den":"A record that a legal instrument, provision or regulatory guidance relevant to CRGO users is new, amended or repealed, with the dates it was identified and takes effect.","dfr":"Enregistrement indiquant qu'un instrument juridique, une disposition ou une orientation réglementaire pertinent pour les utilisateurs de CRGO est nouveau, modifié ou abrogé, avec ses dates de repérage et de prise d'effet.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000510","en":"reassessment trigger","fr":"déclencheur de réévaluation","den":"A record that an event, such as a regulatory change, an incident, an audit finding or the expiry of an exception, requires an existing assessment or determination to be reviewed.","dfr":"Enregistrement indiquant qu'un événement, comme un changement réglementaire, un incident, une constatation d'audit ou l'échéance d'une dérogation, exige la révision d'une évaluation ou d'un constat existant.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000511","en":"nonconformity","fr":"non-conformité","den":"A dated record that a stated requirement, such as a provision, policy statement or management-system requirement, is not fulfilled by an organisation, raised by an audit, an assessment or self-reporting.","dfr":"Enregistrement daté indiquant qu'une exigence donnée, comme une disposition, un énoncé de politique ou une exigence de système de management, n'est pas satisfaite par une organisation, relevé par un audit, une évaluation ou une déclaration interne.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000512","en":"evidence requirement","fr":"exigence de preuve","den":"A directive stating what evidence must exist, and how it may be obtained, for a requirement or obligation to be shown as met.","dfr":"Directive précisant quelles preuves doivent exister, et comment elles peuvent être obtenues, pour démontrer qu'une exigence ou une obligation est respectée.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000513","en":"obligated party role","fr":"rôle de partie assujettie","den":"The role of an organisation or person that a legal obligation or provision binds.","dfr":"Rôle d'une organisation ou d'une personne liée par une obligation ou une disposition légale.","mod":"grc","parents":["http://purl.obolibrary.org/obo/BFO_0000023"],"bucket":"role","values":[]},{"id":"CRGO_0000514","en":"documentary evidence","fr":"preuve documentaire","den":"An evidence item describing documents, such as policies, contracts, plans or records prepared in the course of business.","dfr":"Élément de preuve décrivant des documents, comme des politiques, des contrats, des plans ou des registres établis dans le cours des activités.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000515","en":"configuration evidence","fr":"preuve de configuration","den":"An evidence item describing system settings or configuration exports captured from a system at a stated time.","dfr":"Élément de preuve décrivant des paramètres ou des exportations de configuration saisis dans un système à un moment donné.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000516","en":"transactional evidence","fr":"preuve transactionnelle","den":"An evidence item describing records of individual transactions or events, such as access requests, change tickets or log entries, from which samples can be drawn.","dfr":"Élément de preuve décrivant des enregistrements de transactions ou d'événements individuels, comme des demandes d'accès, des billets de changement ou des entrées de journal, dans lesquels on peut prélever des échantillons.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000517","en":"operational evidence","fr":"preuve opérationnelle","den":"An evidence item describing output of the routine operation or monitoring of a control, such as reports, dashboards or alerts.","dfr":"Élément de preuve décrivant le produit du fonctionnement courant ou de la surveillance d'une mesure, comme des rapports, des tableaux de bord ou des alertes.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000518","en":"interview evidence","fr":"preuve par entretien","den":"An evidence item describing statements obtained by questioning knowledgeable persons, with who was interviewed and when.","dfr":"Élément de preuve décrivant des déclarations obtenues en interrogeant des personnes compétentes, avec l'identité des personnes interrogées et la date.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000519","en":"observational evidence","fr":"preuve par observation","den":"An evidence item describing what an assessor saw while watching a process or control being performed.","dfr":"Élément de preuve décrivant ce qu'un évaluateur a constaté en observant l'exécution d'un processus ou d'une mesure.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000520","en":"test evidence","fr":"preuve d'essai","den":"An evidence item describing the result of an assessor exercising or re-performing a control under stated conditions and comparing actual with expected behaviour.","dfr":"Élément de preuve décrivant le résultat d'un évaluateur qui actionne ou réexécute une mesure dans des conditions données et compare le comportement réel au comportement attendu.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000521","en":"governance evidence","fr":"preuve de gouvernance","den":"An evidence item describing governance acts, such as minutes, approvals, charters or delegations.","dfr":"Élément de preuve décrivant des actes de gouvernance, comme des procès-verbaux, des approbations, des chartes ou des délégations.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000522","en":"external assurance report","fr":"rapport d'assurance externe","den":"An evidence item describing a report issued by an independent assurer on an organisation's or a service provider's controls, such as a SOC 1 or SOC 2 report or a certification audit report, with its type, period, scope, opinion, exceptions and the controls it expects users to operate.","dfr":"Élément de preuve décrivant un rapport émis par un assureur indépendant sur les mesures d'une organisation ou d'un fournisseur de services, comme un rapport SOC 1 ou SOC 2 ou un rapport d'audit de certification, avec son type, sa période, son périmètre, son opinion, ses exceptions et les mesures qu'il attend des utilisateurs.","mod":"assurance","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0000523","en":"assurance report exception","fr":"exception de rapport d'assurance","den":"A deviation reported in an external assurance report, where a tested control did not operate as described during the period.","dfr":"Écart signalé dans un rapport d'assurance externe, lorsqu'une mesure testée n'a pas fonctionné comme décrit pendant la période.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000524","en":"complementary user entity control","fr":"mesure complémentaire de l'entité utilisatrice","den":"A control that an external assurance report assumes the user organisation operates, without which the service provider's controls may not achieve their objectives.","dfr":"Mesure que le rapport d'assurance externe suppose exploitée par l'organisation utilisatrice, sans laquelle les mesures du fournisseur de services pourraient ne pas atteindre leurs objectifs.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000525","en":"evidence sufficiency assessment","fr":"évaluation du caractère suffisant des preuves","den":"A dated record of an assessor's judgement of whether the evidence gathered is sufficient, relevant, current and in scope for a stated objective or criterion.","dfr":"Enregistrement daté du jugement d'un évaluateur sur le caractère suffisant, pertinent, actuel et conforme au périmètre des preuves recueillies pour un objectif ou un critère donné.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000526","en":"operating effectiveness assessment","fr":"évaluation de l'efficacité opérationnelle","den":"A control assessment that tests whether a control measure operated as designed throughout a stated period, over a stated population or sample.","dfr":"Évaluation de mesure qui vérifie si une mesure appliquée a fonctionné comme prévu pendant toute une période donnée, sur une population ou un échantillon donné.","mod":"assurance","parents":["CRGO_0000347"],"bucket":"process","values":[]},{"id":"CRGO_0000527","en":"control deficiency","fr":"déficience de contrôle","den":"A record that the design, implementation or operation of an existing control measure does not allow it to meet its objective, identified by a control assessment, with its severity. Unlike a control gap, which describes an expected control that is absent or inadequate (often in a risk scenario), a deficiency is an assessed result about a measure in place.","dfr":"Enregistrement indiquant que la conception, la mise en œuvre ou le fonctionnement d'une mesure appliquée existante ne lui permet pas d'atteindre son objectif, relevé par une évaluation de mesure, avec sa gravité. Contrairement à un écart de contrôle, qui décrit un contrôle attendu absent ou insuffisant (souvent dans un scénario de risque), une déficience est un résultat d'évaluation portant sur une mesure en place.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000528","en":"population","fr":"population","den":"A description of the complete set of items, such as transactions, accounts or events over a period, from which a sample is drawn or over which a control is tested.","dfr":"Description de l'ensemble complet des éléments, comme des transactions, des comptes ou des événements sur une période, dans lequel un échantillon est prélevé ou sur lequel une mesure est testée.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000529","en":"sampling plan","fr":"plan d'échantillonnage","den":"A plan that states how items are selected from a population, how many, and the tolerable and expected deviation on which the sample size is based.","dfr":"Plan qui précise comment les éléments sont choisis dans une population, combien, et les taux d'écart tolérable et attendu sur lesquels repose la taille de l'échantillon.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000530","en":"sample item","fr":"élément d'échantillon","den":"A description of one item selected under a sampling plan and the result of testing it.","dfr":"Description d'un élément choisi selon un plan d'échantillonnage et du résultat de son essai.","mod":"assurance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000531","en":"audit universe","fr":"univers d'audit","den":"A description of all the auditable entities of an organisation from which the internal audit plan is drawn.","dfr":"Description de toutes les entités auditables d'une organisation dans laquelle est puisé le plan d'audit interne.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000532","en":"auditable entity","fr":"entité auditable","den":"A description of a unit, process, system, programme or third party that can be the subject of an audit engagement.","dfr":"Description d'une unité, d'un processus, d'un système, d'un programme ou d'un tiers qui peut faire l'objet d'une mission d'audit.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000533","en":"audit plan","fr":"plan d'audit","den":"A plan, usually approved by the governing body, that sets out the audit engagements to be performed over a stated period and why.","dfr":"Plan, généralement approuvé par l'organe de gouvernance, qui énumère les missions d'audit à réaliser pendant une période donnée et leur justification.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000534","en":"audit work programme","fr":"programme de travail d'audit","den":"A reusable plan of audit procedures for a domain, giving objectives, criteria, control references, methods, expected evidence, population and sampling rationale.","dfr":"Plan réutilisable de procédures d'audit pour un domaine, indiquant les objectifs, les critères, les références de mesures, les méthodes, les preuves attendues, la population et la justification de l'échantillonnage.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000535","en":"audit procedure","fr":"procédure d'audit","den":"A plan for one audit step, stating the assessment method, the objectives it serves, the evidence to obtain, the expected result and when a deviation counts as an exception.","dfr":"Plan d'une étape d'audit, indiquant la méthode d'évaluation, les objectifs visés, les preuves à obtenir, le résultat attendu et les conditions dans lesquelles un écart constitue une exception.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000536","en":"audit engagement","fr":"mission d'audit","den":"A planned act of assurance or advice on an auditable entity, with stated objectives, scope, criteria and period, performed by an audit team.","dfr":"Acte planifié d'assurance ou de conseil sur une entité auditable, avec des objectifs, un périmètre, des critères et une période donnés, réalisé par une équipe d'audit.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000537","en":"audit objective","fr":"objectif d'audit","den":"An objective stating what an audit engagement is to establish, such as whether access to a system is restricted to authorised users.","dfr":"Objectif précisant ce qu'une mission d'audit doit établir, par exemple si l'accès à un système est réservé aux utilisateurs autorisés.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000476"],"bucket":"ice","values":[]},{"id":"CRGO_0000538","en":"audit criterion","fr":"critère d'audit","den":"A requirement used as the reference against which the condition found is compared, such as a provision, a control objective, a policy statement or an assessment objective.","dfr":"Exigence servant de référence à laquelle la situation constatée est comparée, comme une disposition, un objectif de mesure, un énoncé de politique ou un objectif d'évaluation.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000539","en":"evidence request","fr":"demande de preuves","den":"A request from an assessor to an identified agent for stated evidence by a stated date.","dfr":"Demande adressée par un évaluateur à un agent identifié pour obtenir des preuves déterminées à une date donnée.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000540","en":"monitoring exception","fr":"exception de surveillance","den":"A record that continuous monitoring, such as a key risk indicator or automated control check, flagged a deviation. It is not an audit finding; it becomes the basis of one only if an audit engagement evaluates it against criteria.","dfr":"Enregistrement indiquant qu'une surveillance continue, comme un indicateur clé de risque ou une vérification automatisée, a signalé un écart. Ce n'est pas une constatation d'audit; il n'en devient le fondement que si une mission d'audit l'évalue au regard de critères.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000541","en":"audit finding","fr":"constatation d'audit","den":"A record, made in an audit engagement, of the difference between a criterion and the condition found, with its observed or hypothesised cause, its effect, its significance and the evidence relied on.","dfr":"Enregistrement, établi dans une mission d'audit, de l'écart entre un critère et la situation constatée, avec sa cause observée ou présumée, son effet, son importance et les preuves retenues.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000542","en":"audit conclusion","fr":"conclusion d'audit","den":"A record of the overall result of an audit engagement against its objectives, based on its findings.","dfr":"Enregistrement du résultat global d'une mission d'audit au regard de ses objectifs, fondé sur ses constatations.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000543","en":"audit report","fr":"rapport d'audit","den":"A document that communicates an audit engagement's objectives, scope, findings, conclusions, recommendations and management responses.","dfr":"Document qui communique les objectifs, le périmètre, les constatations, les conclusions, les recommandations et les réponses de la direction d'une mission d'audit.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000544","en":"recommendation","fr":"recommandation","den":"A directive proposed by an assessor to address the cause or effect of a finding.","dfr":"Directive proposée par un évaluateur pour remédier à la cause ou à l'effet d'une constatation.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000545","en":"management response","fr":"réponse de la direction","den":"A dated record of management's position on a finding or recommendation, such as agreeing and committing to action, disagreeing, or accepting the risk.","dfr":"Enregistrement daté de la position de la direction sur une constatation ou une recommandation, comme l'accord et l'engagement à agir, le désaccord ou l'acceptation du risque.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000546","en":"corrective action","fr":"action corrective","den":"A plan of action by an owner, with a due date, to eliminate the cause of a finding or nonconformity and prevent its recurrence.","dfr":"Plan d'action confié à un responsable, avec une échéance, pour éliminer la cause d'une constatation ou d'une non-conformité et en empêcher la répétition.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000547","en":"follow-up verification","fr":"vérification de suivi","den":"A planned act in which an assessor independent of the action owner checks whether a corrective action was implemented and is effective.","dfr":"Acte planifié par lequel un évaluateur indépendant du responsable de l'action vérifie si une action corrective a été mise en œuvre et si elle est efficace.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000548","en":"finding closure","fr":"clôture de constatation","den":"A dated record that a finding is closed, citing the follow-up verification or the risk acceptance it relies on.","dfr":"Enregistrement daté indiquant qu'une constatation est close, en citant la vérification de suivi ou l'acceptation du risque sur laquelle il s'appuie.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000549","en":"finding reopening","fr":"réouverture de constatation","den":"A dated record that a closed finding is reopened, with the reason, such as the recurrence of the condition.","dfr":"Enregistrement daté indiquant qu'une constatation close est rouverte, avec le motif, comme la réapparition de la situation.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000550","en":"security event","fr":"événement de sécurité","den":"An observable occurrence in an information system or network that may be relevant to security, such as a failed login or a malware detection. An event can be part of an incident; most events are not.","dfr":"Occurrence observable dans un système d'information ou un réseau qui peut intéresser la sécurité, comme un échec d'ouverture de session ou une détection de logiciel malveillant. Un événement peut faire partie d'un incident; la plupart n'en font pas partie.","mod":"incident","parents":["http://purl.obolibrary.org/obo/BFO_0000015"],"bucket":"process","values":[]},{"id":"CRGO_0000551","en":"security alert","fr":"alerte de sécurité","den":"A notification, generated by a monitoring tool or a person, that one or more security events may indicate an incident and need triage.","dfr":"Notification, produite par un outil de surveillance ou une personne, indiquant qu'un ou plusieurs événements de sécurité pourraient signaler un incident et doivent être triés.","mod":"incident","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000552","en":"incident confirmation","fr":"confirmation d'incident","den":"A dated record, made by an identified agent, that an incident has occurred, citing the alerts or events it is based on.","dfr":"Enregistrement daté, établi par un agent identifié, indiquant qu'un incident s'est produit, en citant les alertes ou événements sur lesquels il s'appuie.","mod":"incident","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000553","en":"breach reportability assessment","fr":"évaluation du caractère déclarable d'un incident","den":"A dated record of whether an incident must be reported to a regulator or to affected persons under a stated provision, such as a confidentiality incident presenting a risk of serious injury under Loi 25 or a personal data breach under the GDPR.","dfr":"Enregistrement daté indiquant si un incident doit être déclaré à une autorité ou aux personnes concernées en vertu d'une disposition donnée, comme un incident de confidentialité présentant un risque de préjudice sérieux selon la Loi 25 ou une violation de données à caractère personnel selon le RGPD.","mod":"incident","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000554","en":"incident timeline entry","fr":"entrée de chronologie d'incident","den":"A dated entry in the timeline of an incident, recording what happened or was done and in which response phase.","dfr":"Entrée datée de la chronologie d'un incident, indiquant ce qui s'est passé ou a été fait et dans quelle phase de réponse.","mod":"incident","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000555","en":"lesson learned","fr":"leçon apprise","den":"A record of what an incident or exercise showed should change, such as a control, procedure or scenario estimate.","dfr":"Enregistrement de ce qu'un incident ou un exercice a montré devoir changer, comme une mesure, une procédure ou l'estimation d'un scénario.","mod":"incident","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000556","en":"knowledge status","fr":"statut épistémique","den":"The epistemic category of a record or assertion, saying what kind of claim it is and so how far it can be relied on.","dfr":"Catégorie épistémique d'un enregistrement ou d'une assertion, indiquant de quel type d'affirmation il s'agit et donc dans quelle mesure on peut s'y fier.","mod":"evidence","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["analytical hypothesis (knowledge status)","audit conclusion (knowledge status)","management decision","organisational observation","reference fact","risk estimate","verified outcome"]},{"id":"CRGO_0000565","en":"source access status","fr":"statut d'accès à la source","den":"Whether CRGO holds and may use a source, and so what it can import from it.","dfr":"Indique si CRGO détient une source et peut l'utiliser, et donc ce qu'il peut en importer.","mod":"evidence","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["licence restricted","pending access","rejected source","verified source"]},{"id":"CRGO_0000571","en":"evidence quality","fr":"qualité des preuves","den":"How strongly the evidence behind an estimate or conclusion supports it.","dfr":"Degré auquel les preuves qui sous-tendent une estimation ou une conclusion l'appuient.","mod":"evidence","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["high-quality evidence","low-quality evidence","moderate-quality evidence","very low-quality evidence"]},{"id":"CRGO_0000577","en":"distribution family","fr":"famille de lois","den":"The family of probability distribution used to express an estimate's uncertainty.","dfr":"Famille de lois de probabilité servant à exprimer l'incertitude d'une estimation.","mod":"evidence","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["PERT (beta-PERT)","beta","empirical","lognormal","normal","triangular","uniform"]},{"id":"CRGO_0000586","en":"decision outcome","fr":"résultat de la décision","den":"The outcome recorded by a decision record.","dfr":"Résultat consigné par un relevé de décision.","mod":"governance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved (decision)","deferred (decision)","escalated (decision)","rejected (decision)"]},{"id":"CRGO_0000592","en":"independence conclusion","fr":"conclusion sur l'indépendance","den":"The conclusion of an independence assessment.","dfr":"Conclusion d'une évaluation de l'indépendance.","mod":"governance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["impaired, disclosed","independent","not independent"]},{"id":"CRGO_0000597","en":"assessment method","fr":"méthode d'évaluation","den":"The method by which an assessor obtains evidence about a control or requirement.","dfr":"Méthode par laquelle un évaluateur obtient des preuves sur une mesure ou une exigence.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["examine","interview","test"]},{"id":"CRGO_0000602","en":"assessor line","fr":"ligne de l'évaluateur","den":"The capacity in which a control assessment was performed, which bears on how much independent assurance it gives.","dfr":"Qualité en laquelle une évaluation de mesure a été réalisée, qui détermine le degré d'assurance indépendante qu'elle apporte.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["external assurer","internal audit","management self-assessment","second line"]},{"id":"CRGO_0000608","en":"regulatory change type","fr":"type de changement réglementaire","den":"The kind of a regulatory change.","dfr":"Type d'un changement réglementaire.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["amended","guidance or interpretation","new instrument or provision","repealed"]},{"id":"CRGO_0000614","en":"control aspect","fr":"aspect de la mesure","den":"The aspect of a control measure that an assessment or deficiency concerns.","dfr":"Aspect d'une mesure appliquée que vise une évaluation ou une déficience.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["design","implementation","operation"]},{"id":"CRGO_0000619","en":"deficiency severity","fr":"gravité de la déficience","den":"How serious a control deficiency is, as judged by the assessor.","dfr":"Gravité d'une déficience de contrôle, selon le jugement de l'évaluateur.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["major","minor","significant"]},{"id":"CRGO_0000624","en":"sufficiency conclusion","fr":"conclusion sur le caractère suffisant","den":"The conclusion of an evidence sufficiency assessment.","dfr":"Conclusion d'une évaluation du caractère suffisant des preuves.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["insufficient","out of date","out of scope","sufficient and appropriate","sufficient with limitations","unavailable"]},{"id":"CRGO_0000630","en":"assurance report type","fr":"type de rapport d'assurance","den":"The kind of an external assurance report.","dfr":"Type d'un rapport d'assurance externe.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["SOC 1 type 1","SOC 1 type 2","SOC 2 type 1","SOC 2 type 2","SOC 3","certification audit report","other assurance report"]},{"id":"CRGO_0000639","en":"assurance opinion","fr":"opinion d'assurance","den":"The opinion expressed in an external assurance report.","dfr":"Opinion exprimée dans un rapport d'assurance externe.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["adverse","disclaimer","qualified","unmodified"]},{"id":"CRGO_0000645","en":"sampling method","fr":"méthode d'échantillonnage","den":"How the items of a sample are selected.","dfr":"Façon dont les éléments d'un échantillon sont choisis.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["haphazard selection","judgemental selection","random selection","stratified selection","systematic selection"]},{"id":"CRGO_0000652","en":"sample result","fr":"résultat d'élément d'échantillon","den":"The result of testing one sample item.","dfr":"Résultat de l'essai d'un élément d'échantillon.","mod":"assurance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["conforming","deviation","not testable"]},{"id":"CRGO_0000657","en":"finding significance","fr":"importance de la constatation","den":"The significance of an audit finding, as rated by the assessor under a stated method.","dfr":"Importance d'une constatation d'audit, selon la cote attribuée par l'évaluateur suivant une méthode indiquée.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["critical significance","high significance","low significance","medium significance"]},{"id":"CRGO_0000663","en":"engagement rating","fr":"cote de la mission","den":"The overall rating given in an audit conclusion.","dfr":"Cote globale attribuée dans une conclusion d'audit.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["needs improvement","satisfactory","unsatisfactory"]},{"id":"CRGO_0000668","en":"management response stance","fr":"position de la direction","den":"Management's position in a response to a finding or recommendation.","dfr":"Position de la direction dans sa réponse à une constatation ou à une recommandation.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["accepts the risk","agrees, will act","disagrees","partly agrees"]},{"id":"CRGO_0000674","en":"corrective action status","fr":"état de l'action corrective","den":"The state of a corrective action, as last recorded.","dfr":"État d'une action corrective, selon le dernier enregistrement.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["action verified","cancelled","implemented, awaiting verification","in progress","open"]},{"id":"CRGO_0000681","en":"verification result","fr":"résultat de la vérification","den":"The result of a follow-up verification.","dfr":"Résultat d'une vérification de suivi.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["action partly effective","implemented and effective","not implemented or not effective"]},{"id":"CRGO_0000686","en":"reportability state","fr":"état de déclaration","den":"The result of a breach reportability assessment.","dfr":"Résultat d'une évaluation du caractère déclarable d'un incident.","mod":"incident","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["not reportable","reportability undetermined","reportable"]},{"id":"CRGO_0000691","en":"incident response phase","fr":"phase de réponse à l'incident","den":"The phase of incident response an incident timeline entry belongs to.","dfr":"Phase de la réponse à l'incident à laquelle appartient une entrée de chronologie.","mod":"incident","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["containment","detection and analysis","eradication","post-incident review","service recovery"]},{"id":"CRGO_0000885","en":"policy family","fr":"famille de politiques","den":"A named grouping of related directives, such as all the documents on access control, used to find the policies, standards and procedures that cover the same subject.","dfr":"Regroupement nommé de directives apparentées, comme l'ensemble des documents sur le contrôle d'accès, servant à repérer les politiques, normes et procédures qui portent sur un même sujet.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000886","en":"directive version","fr":"version de directive","den":"A fixed release of a policy, technical standard, procedure, guideline, audit charter or methodology, identified by a version label, with its approval, effective and retirement dates. Once effective its content does not change; a change makes a new version.","dfr":"Diffusion figée d'une politique, d'une norme technique, d'une procédure, d'une ligne directrice, d'une charte ou d'une méthodologie d'audit, désignée par un libellé de version, avec ses dates d'approbation, d'entrée en vigueur et de retrait. Une fois en vigueur, son contenu ne change plus; toute modification crée une nouvelle version.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000887","en":"policy version","fr":"version de politique","den":"A directive version of a policy.","dfr":"Version de directive d'une politique.","mod":"policy","parents":["CRGO_0000886"],"bucket":"ice","values":[]},{"id":"CRGO_0000888","en":"policy clause","fr":"article de politique","den":"A numbered or titled part of a directive version that contains one or more policy statements, used to cite where a statement appears.","dfr":"Partie numérotée ou titrée d'une version de directive qui contient un ou plusieurs énoncés de politique, servant à citer l'emplacement d'un énoncé.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000889","en":"guideline","fr":"ligne directrice interne","den":"A directive, issued as guidance separate from any policy, that recommends a practice without making it mandatory. Departing from a guideline needs no exception. A 'should' or 'may' statement written inside a policy is a policy statement, not a guideline.","dfr":"Directive, publiée à titre d'orientation distincte de toute politique, qui recommande une pratique sans la rendre obligatoire. S'en écarter n'exige aucune dérogation. Un énoncé « devrait » ou « peut » rédigé dans une politique est un énoncé de politique, et non une ligne directrice.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000890","en":"directive review","fr":"revue de directive","den":"A planned act in which a directive or some of its statements are reviewed, on schedule or after a trigger such as a regulatory change, an incident or an audit finding, ending in a decision to keep, revise or retire them.","dfr":"Acte planifié par lequel une directive ou certains de ses énoncés sont revus, selon le calendrier ou à la suite d'un déclencheur comme un changement réglementaire, un incident ou une constatation d'audit, et qui aboutit à la décision de les maintenir, de les réviser ou de les retirer.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000891","en":"attestation","fr":"attestation","den":"A dated declaration by an identified agent about a stated subject and scope, such as having read a policy version or that a requirement is met. It records what the agent declares, not what was verified.","dfr":"Déclaration datée d'un agent identifié portant sur un objet et un périmètre précisés, comme le fait d'avoir lu une version de politique ou le fait qu'une exigence soit respectée. Elle consigne ce que l'agent déclare, et non ce qui a été vérifié.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000892","en":"policy acknowledgement","fr":"accusé de lecture de politique","den":"An attestation by a person that they have received and read an exact policy version that applies to them. Acknowledging a policy is not understanding or complying with it.","dfr":"Attestation par laquelle une personne déclare avoir reçu et lu une version précise d'une politique qui s'applique à elle. Prendre connaissance d'une politique n'équivaut ni à la comprendre ni à la respecter.","mod":"policy","parents":["CRGO_0000891"],"bucket":"ice","values":[]},{"id":"CRGO_0000893","en":"training requirement","fr":"exigence de formation","den":"A directive that persons in a stated role or scope complete stated training, usually because a policy statement applies to them. Completing training is not the same as acknowledging or complying.","dfr":"Directive exigeant que les personnes d'un rôle ou d'un périmètre précisés suivent une formation donnée, généralement parce qu'un énoncé de politique s'applique à elles. Suivre la formation ne revient ni à prendre connaissance de la politique ni à la respecter.","mod":"policy","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000894","en":"compliance programme","fr":"programme de conformité","den":"The plan by which an organisation operates its compliance management system: its scope, the obligations and commitments it covers, its objectives, the roles involved and its review cycle.","dfr":"Plan par lequel une organisation exploite son système de management de la conformité : son périmètre, les obligations et engagements qu'il couvre, ses objectifs, les rôles en cause et son cycle de revue.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000895","en":"compliance objective","fr":"objectif de conformité","den":"A measurable objective that a compliance programme sets itself, such as reviewing every obligation of the register once a year.","dfr":"Objectif mesurable que se fixe un programme de conformité, comme revoir chaque obligation du registre une fois par année.","mod":"compliance","parents":["CRGO_0000010"],"bucket":"ice","values":[]},{"id":"CRGO_0000896","en":"requirement interpretation","fr":"interprétation d'exigence","den":"A statement, subject to legal review, of how an organisation reads an obligation, provision or framework requirement for its own situation, with the assumptions made and its legal review state. It is the organisation's reading, not the text and not legal advice.","dfr":"Énoncé, soumis à une revue juridique, de la façon dont une organisation lit une obligation, une disposition ou une exigence de référentiel au regard de sa propre situation, avec les hypothèses retenues et l'état de sa revue juridique. C'est la lecture de l'organisation, et non le texte ni un avis juridique.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000897","en":"regulatory authority","fr":"autorité de réglementation","den":"An organisation with legal power to issue, supervise or enforce legal instruments in a jurisdiction, such as a data protection authority.","dfr":"Organisation ayant le pouvoir légal d'édicter, de surveiller ou de faire appliquer des instruments juridiques dans une juridiction, comme une autorité de protection des données.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00001180"],"bucket":"material","values":[]},{"id":"CRGO_0000898","en":"framework adoption","fr":"adoption de référentiel","den":"A decision record by which an organisation has committed to meet a framework, or a stated part of it, for a stated scope, which makes its requirements commitments of that organisation. It records the commitment, not conformity.","dfr":"Relevé de décision par lequel une organisation s'engage à respecter un référentiel, ou une partie précisée de celui-ci, pour un périmètre donné, ce qui fait de ses exigences des engagements de cette organisation. Il consigne l'engagement, et non la conformité.","mod":"compliance","parents":["CRGO_0000504"],"bucket":"ice","values":[]},{"id":"CRGO_0000899","en":"compliance assessment campaign","fr":"campagne d'évaluation de la conformité","den":"A planned act in which an organisation assesses compliance with a stated set of obligations or requirements, for a stated scope, period and method, producing compliance determinations.","dfr":"Acte planifié par lequel une organisation évalue sa conformité à un ensemble précisé d'obligations ou d'exigences, pour un périmètre, une période et une méthode donnés, et qui produit des constats de conformité.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000900","en":"provision version","fr":"version de disposition","den":"A record of the wording of a provision as in force over a stated period, kept when an amendment changes that wording, so that earlier assessments can be reproduced against the text that applied then.","dfr":"Enregistrement du libellé d'une disposition tel qu'il était en vigueur pendant une période donnée, conservé lorsqu'une modification change ce libellé, afin que les évaluations antérieures puissent être reproduites au regard du texte alors applicable.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000901","en":"compliance deadline","fr":"échéance de conformité","den":"A record of when an obligation must be met, either on a calendar date or within a period counted from a triggering event, such as 72 hours after becoming aware of a breach, with how the date is computed.","dfr":"Enregistrement du moment où une obligation doit être respectée, soit à une date fixe, soit dans un délai compté à partir d'un événement déclencheur, comme 72 heures après la prise de connaissance d'une atteinte, avec le mode de calcul de la date.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000902","en":"regulatory submission","fr":"transmission réglementaire","den":"A record of a notice, filing or report sent to an authority under an obligation, with when it was submitted, its state and the receipt or acknowledgement obtained.","dfr":"Enregistrement d'un avis, d'un dépôt ou d'un rapport transmis à une autorité en vertu d'une obligation, avec sa date de transmission, son état et l'accusé de réception obtenu.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000903","en":"regulatory exemption","fr":"dispense réglementaire","den":"A directive issued by an authority that relieves an organisation, for a stated scope and period, from an obligation or part of it, on a stated legal basis. Only an authority with power over the obligation can grant it; an internal approval cannot.","dfr":"Directive émise par une autorité qui dispense une organisation, pour un périmètre et une période donnés, de tout ou partie d'une obligation, sur un fondement juridique précisé. Seule une autorité compétente à l'égard de l'obligation peut l'accorder; une approbation interne ne le peut pas.","mod":"compliance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000904","en":"compliance attestation","fr":"attestation de conformité","den":"An attestation by an identified signatory that an organisation meets stated obligations or requirements for a stated scope and period, citing what it is based on. It is a management declaration, not an audit conclusion.","dfr":"Attestation par laquelle un signataire identifié déclare qu'une organisation respecte des obligations ou des exigences précisées pour un périmètre et une période donnés, en citant ce sur quoi elle se fonde. C'est une déclaration de la direction, et non une conclusion d'audit.","mod":"compliance","parents":["CRGO_0000891"],"bucket":"ice","values":[]},{"id":"CRGO_0000905","en":"audit function","fr":"fonction d'audit","den":"The group of agents in an organisation that performs internal audit under a charter, led by the chief audit executive.","dfr":"Groupe d'agents d'une organisation qui exerce l'audit interne en vertu d'une charte, sous la direction du responsable de l'audit interne.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000300"],"bucket":"material","values":[]},{"id":"CRGO_0000906","en":"audit charter","fr":"charte d'audit","den":"A directive approved by the governing body that sets the internal audit function's purpose, authority, responsibilities and reporting lines.","dfr":"Directive approuvée par l'organe de gouvernance qui fixe la mission, les pouvoirs, les responsabilités et les liens hiérarchiques de la fonction d'audit interne.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000907","en":"audit methodology","fr":"méthodologie d'audit","den":"A directive that sets how an audit function plans, performs and reports engagements, including its sampling and rating rules, identified by version.","dfr":"Directive qui fixe la façon dont une fonction d'audit planifie, réalise et communique ses missions, y compris ses règles d'échantillonnage et de cotation, désignée par sa version.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000908","en":"audit plan entry","fr":"entrée du plan d'audit","den":"An entry of an audit plan for one candidate or planned engagement, with its priority rationale, its state (proposed, approved, deferred, cancelled or completed) and, when deferred or cancelled, the reason and who authorised it.","dfr":"Entrée d'un plan d'audit pour une mission envisagée ou prévue, avec la justification de sa priorité, son état (proposée, approuvée, reportée, annulée ou réalisée) et, en cas de report ou d'annulation, le motif et l'auteur de l'autorisation.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000909","en":"audit workpaper","fr":"feuille de travail d'audit","den":"A record prepared by an auditor that documents work performed, evidence examined and conclusions reached in an engagement, with who prepared it and who reviewed it. CRGO holds its metadata, not its content.","dfr":"Document établi par un auditeur qui consigne les travaux effectués, les preuves examinées et les conclusions tirées dans une mission, avec son auteur et son réviseur. CRGO en conserve les métadonnées, et non le contenu.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000910","en":"audit observation","fr":"observation d'audit","den":"A preliminary record of a condition noted during an engagement that has not yet been validated against criteria and evidence. It is not a finding and carries no audit conclusion.","dfr":"Enregistrement préliminaire d'une situation relevée pendant une mission, qui n'a pas encore été validée au regard des critères et des preuves. Ce n'est pas une constatation et elle ne porte aucune conclusion d'audit.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000911","en":"audit quality review","fr":"revue de qualité de l'audit","den":"A planned act in which the work of an engagement or of the audit function is evaluated against its methodology and the standards it follows, by a supervisor, an internal quality assessor or an external assessor.","dfr":"Acte planifié par lequel les travaux d'une mission ou de la fonction d'audit sont évalués au regard de sa méthodologie et des normes qu'elle suit, par un superviseur, un évaluateur interne de la qualité ou un évaluateur externe.","mod":"audit","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000912","en":"mapping assertion","fr":"assertion de correspondance","den":"A directional statement, subject to review, that a source requirement corresponds to a target requirement in a stated way (exact, full or partial coverage, broader, narrower, related or conflicting), with the editions mapped, the rationale, the confidence, the reviewer and its review state. A mapping is not evidence of compliance.","dfr":"Énoncé orienté, soumis à une revue, selon lequel une exigence source correspond à une exigence cible d'une façon précisée (exacte, couverture totale ou partielle, plus large, plus étroite, liée ou contradictoire), avec les éditions mises en correspondance, la justification, le degré de confiance, le réviseur et l'état de la revue. Une correspondance ne prouve pas la conformité.","mod":"mapping","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000913","en":"normative modality","fr":"modalité normative","den":"How binding a policy statement is.","dfr":"Degré de contrainte d'un énoncé de politique.","mod":"policy","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["may","must","must not","should"]},{"id":"CRGO_0000919","en":"directive lifecycle state","fr":"état du cycle de vie d'une directive","den":"The state of a directive version in the organisation's document lifecycle. Not the governance status of a CRGO term.","dfr":"État d'une version de directive dans le cycle de vie documentaire de l'organisation. Ce n'est pas le statut de gouvernance d'un terme de CRGO.","mod":"policy","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved (directive)","draft (directive)","published (directive)","retired (directive)","superseded (directive)","under review (directive)"]},{"id":"CRGO_0000927","en":"review trigger","fr":"déclencheur de revue","den":"What caused a directive review.","dfr":"Ce qui a provoqué une revue de directive.","mod":"policy","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["audit or assessment finding (trigger)","incident (trigger)","organisational change (trigger)","regulatory change (trigger)","risk change (trigger)","scheduled review","technology change (trigger)"]},{"id":"CRGO_0000936","en":"legal review state","fr":"état de la revue juridique","den":"How far a requirement interpretation has been reviewed by legal counsel.","dfr":"Degré de revue d'une interprétation d'exigence par un conseiller juridique.","mod":"compliance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["legal review in progress","legally reviewed","not legally reviewed"]},{"id":"CRGO_0000941","en":"submission state","fr":"état de la transmission","den":"The state of a regulatory submission.","dfr":"État d'une transmission réglementaire.","mod":"compliance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["acknowledged by the authority","rejected by the authority","submission in preparation","submitted"]},{"id":"CRGO_0000947","en":"deadline trigger kind","fr":"type de déclenchement d'échéance","den":"How a compliance deadline is set.","dfr":"Façon dont une échéance de conformité est fixée.","mod":"compliance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["calendar deadline","event-triggered deadline"]},{"id":"CRGO_0000951","en":"root-cause category","fr":"catégorie de cause fondamentale","den":"A broad category of the cause of a finding or nonconformity, used to group recurring causes. CRGO's own scale.","dfr":"Grande catégorie de la cause d'une constatation ou d'une non-conformité, servant à regrouper les causes récurrentes. Échelle propre à CRGO.","mod":"compliance","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["control design (cause)","governance (cause)","people (cause)","process (cause)","resourcing (cause)","technology (cause)","third party (cause)"]},{"id":"CRGO_0000960","en":"engagement type","fr":"type de mission","den":"The kind of an audit engagement: its nature (assurance or advisory) and, where relevant, its focus (compliance or follow-up). An engagement may have one nature and one focus.","dfr":"Type d'une mission d'audit : sa nature (assurance ou conseil) et, le cas échéant, son objet (conformité ou suivi). Une mission peut avoir une nature et un objet.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["advisory engagement","assurance engagement","compliance audit","follow-up engagement"]},{"id":"CRGO_0000966","en":"engagement state","fr":"état de la mission","den":"The recorded stage of an audit engagement.","dfr":"Étape consignée d'une mission d'audit.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["engagement cancelled","engagement closed","engagement planning","engagement reporting","fieldwork"]},{"id":"CRGO_0000973","en":"plan entry state","fr":"état de l'entrée du plan","den":"The state of an audit plan entry.","dfr":"État d'une entrée du plan d'audit.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved (plan entry)","cancelled (plan entry)","completed (plan entry)","deferred (plan entry)","proposed (plan entry)"]},{"id":"CRGO_0000980","en":"quality review kind","fr":"type de revue de qualité","den":"The kind of an audit quality review.","dfr":"Type d'une revue de qualité de l'audit.","mod":"audit","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["external quality assessment","internal quality assessment","supervisory review"]},{"id":"CRGO_0000985","en":"mapping type","fr":"type de correspondance","den":"How the source of a mapping assertion corresponds to its target.","dfr":"Façon dont la source d'une assertion de correspondance correspond à sa cible.","mod":"mapping","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["broader mapping","conflicting mapping","exact mapping","full coverage","narrower mapping","partial coverage","related mapping"]},{"id":"CRGO_0000994","en":"review state","fr":"état de la revue","den":"The review state of an organisation record such as a mapping assertion or a requirement interpretation. Not the governance status of a CRGO term.","dfr":"État de la revue d'un enregistrement d'une organisation, comme une assertion de correspondance ou une interprétation d'exigence. Ce n'est pas le statut de gouvernance d'un terme de CRGO.","mod":"mapping","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved (record)","draft (record)","rejected (record)","under review (record)","withdrawn (record)"]},{"id":"CRGO_0001097","en":"telemetry source","fr":"source de télémétrie","den":"A description of a product, service or device configured to send security logs or events to an organisation's monitoring, with the asset it runs on, the kinds of data it sends and how they are collected.","dfr":"Description d'un produit, d'un service ou d'un appareil configuré pour transmettre des journaux ou des événements de sécurité à la surveillance d'une organisation, avec l'actif sur lequel il fonctionne, les types de données qu'il transmet et leur mode de collecte.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001098","en":"security event record","fr":"enregistrement d'événement de sécurité","den":"An observation that points to one security event held in an operational store, with the source that emitted it, when it occurred and was recorded, and the profile it was normalised under. It does not carry the event payload.","dfr":"Observation qui renvoie à un événement de sécurité conservé dans un dépôt opérationnel, avec la source qui l'a émis, le moment où il s'est produit et a été enregistré, et le profil selon lequel il a été normalisé. Elle ne contient pas le contenu de l'événement.","mod":"siem","parents":["CRGO_0000338"],"bucket":"ice","values":[]},{"id":"CRGO_0001099","en":"normalisation profile","fr":"profil de normalisation","den":"A versioned specification of how the fields of a telemetry source are mapped to a common event schema, such as an OCSF event class, so that events from different sources can be compared.","dfr":"Spécification versionnée de la façon dont les champs d'une source de télémétrie sont mis en correspondance avec un schéma d'événements commun, comme une classe d'événements OCSF, afin que les événements de sources différentes puissent être comparés.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001100","en":"parser definition","fr":"définition d'analyseur","den":"A versioned specification of how raw records of a telemetry source are converted into structured events under a normalisation profile.","dfr":"Spécification versionnée de la façon dont les enregistrements bruts d'une source de télémétrie sont convertis en événements structurés selon un profil de normalisation.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001101","en":"detection strategy","fr":"stratégie de détection","den":"An organisation's documented approach to detecting a technique or behaviour, stating what to look for, in which data, and which analytics and rules carry it out; it may adapt a reference strategy such as an ATT&CK detection strategy.","dfr":"Approche documentée d'une organisation pour détecter une technique ou un comportement, qui précise ce qu'il faut rechercher, dans quelles données, et quelles analyses et règles la mettent en œuvre; elle peut adapter une stratégie de référence comme une stratégie de détection ATT&CK.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0001102","en":"detection rule","fr":"règle de détection","den":"A versioned, deployable specification of the conditions under which events should raise an alert, such as a Sigma rule or a rule in a product's native language, with its status and the telemetry it needs.","dfr":"Spécification versionnée et déployable des conditions dans lesquelles des événements doivent déclencher une alerte, comme une règle Sigma ou une règle dans le langage propre d'un produit, avec son état et la télémétrie dont elle a besoin.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001103","en":"correlation rule","fr":"règle de corrélation","den":"A detection rule whose conditions combine several events or alerts, over a time window or by a shared attribute.","dfr":"Règle de détection dont les conditions combinent plusieurs événements ou alertes, sur une fenêtre de temps ou selon un attribut commun.","mod":"siem","parents":["CRGO_0001102"],"bucket":"ice","values":[]},{"id":"CRGO_0001104","en":"threat indicator","fr":"indicateur de menace","den":"A description of a pattern, such as a file hash, address, domain or behaviour, that a source states may indicate malicious activity, with its validity period, its confidence as given by the source and how that confidence is defined. A match with an indicator is not by itself an incident or an attribution.","dfr":"Description d'un motif, comme une empreinte de fichier, une adresse, un domaine ou un comportement, qu'une source présente comme pouvant indiquer une activité malveillante, avec sa période de validité, la confiance indiquée par la source et la définition de cette confiance. Une correspondance avec un indicateur ne constitue pas à elle seule un incident ni une attribution.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001105","en":"threat intelligence source","fr":"source de renseignement sur les menaces","den":"A source record for a provider or feed of threat intelligence, with its licence, its sharing marking and the reliability the organisation gives it.","dfr":"Notice de source d'un fournisseur ou d'un flux de renseignement sur les menaces, avec sa licence, son marquage de partage et la fiabilité que lui accorde l'organisation.","mod":"siem","parents":["CRGO_0000337"],"bucket":"ice","values":[]},{"id":"CRGO_0001106","en":"detection coverage","fr":"couverture de détection","den":"A dated statement that a detection strategy or rule covers a technique, a risk scenario or an asset, with its coverage status (untested, validated, degraded or missing) and the tests that support it. Coverage is a claim to be tested, not a guarantee of detection.","dfr":"Énoncé daté selon lequel une stratégie ou une règle de détection couvre une technique, un scénario de risque ou un actif, avec l'état de couverture (non testée, validée, dégradée ou absente) et les essais qui l'étayent. La couverture est une affirmation à vérifier, et non une garantie de détection.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001107","en":"detection gap","fr":"lacune de détection","den":"A control gap finding that a technique, risk scenario or asset has no adequate detection, or that the telemetry a detection needs is missing or unhealthy.","dfr":"Constat de lacune de contrôle selon lequel une technique, un scénario de risque ou un actif n'est pas adéquatement détecté, ou selon lequel la télémétrie nécessaire à une détection est absente ou défaillante.","mod":"siem","parents":["CRGO_0000018"],"bucket":"ice","values":[]},{"id":"CRGO_0001108","en":"detection test","fr":"essai de détection","den":"A control assessment in which a detection rule or strategy is exercised under controlled conditions, such as by replaying or simulating the technique, to check that it raises the expected alert.","dfr":"Évaluation de mesure dans laquelle une règle ou une stratégie de détection est mise à l'épreuve dans des conditions contrôlées, par exemple en rejouant ou en simulant la technique, pour vérifier qu'elle déclenche l'alerte attendue.","mod":"siem","parents":["CRGO_0000347"],"bucket":"process","values":[]},{"id":"CRGO_0001109","en":"telemetry health observation","fr":"observation de l'état de la télémétrie","den":"An observation of whether a telemetry source was delivering the expected data at a stated time, such as healthy, degraded or silent.","dfr":"Observation indiquant si une source de télémétrie transmettait les données attendues à un moment donné, par exemple en bon état, dégradée ou silencieuse.","mod":"siem","parents":["CRGO_0000338"],"bucket":"ice","values":[]},{"id":"CRGO_0001110","en":"hunting hypothesis","fr":"hypothèse de chasse","den":"An analytical hypothesis that a stated adversary behaviour may be present in the organisation's environment, put forward to direct a threat hunt.","dfr":"Hypothèse explicative selon laquelle un comportement adverse donné pourrait être présent dans l'environnement de l'organisation, avancée pour orienter une chasse aux menaces.","mod":"siem","parents":["CRGO_0000475"],"bucket":"ice","values":[]},{"id":"CRGO_0001111","en":"behavioural baseline","fr":"référence comportementale","den":"A description of the usual behaviour of a user, account, host or service over a stated period, against which deviations are measured. CRGO holds its metadata, not the profile data.","dfr":"Description du comportement habituel d'un utilisateur, d'un compte, d'un hôte ou d'un service pendant une période donnée, à partir de laquelle les écarts sont mesurés. CRGO en conserve les métadonnées, et non les données du profil.","mod":"siem","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001112","en":"security investigation","fr":"enquête de sécurité","den":"A planned act in which analysts examine one or more alerts, events or reports to establish what happened, whether it is an incident and what its scope is, with its case status as last recorded.","dfr":"Acte planifié par lequel des analystes examinent une ou plusieurs alertes, événements ou signalements pour établir ce qui s'est passé, s'il s'agit d'un incident et quelle en est l'étendue, avec l'état du dossier selon le dernier enregistrement.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0001113","en":"response playbook","fr":"guide de réponse","den":"A procedure that sets the steps, conditions, actions and approvals by which a kind of alert or incident is to be handled, manually or by automation, such as a CACAO playbook.","dfr":"Procédure qui fixe les étapes, conditions, actions et approbations selon lesquelles un type d'alerte ou d'incident doit être traité, manuellement ou par automatisation, comme un guide CACAO.","mod":"soar","parents":["CRGO_0000500"],"bucket":"ice","values":[]},{"id":"CRGO_0001114","en":"playbook version","fr":"version de guide de réponse","den":"A directive version of a response playbook. Executions cite the exact version they ran.","dfr":"Version de directive d'un guide de réponse. Les exécutions citent la version précise qu'elles ont exécutée.","mod":"soar","parents":["CRGO_0000886"],"bucket":"ice","values":[]},{"id":"CRGO_0001115","en":"playbook step","fr":"étape de guide","den":"A directive that is one step of a playbook version, such as an action, a condition, a branch or a parallel block, with its order and what follows it.","dfr":"Directive qui constitue une étape d'une version de guide, comme une action, une condition, un embranchement ou un bloc parallèle, avec son ordre et ce qui la suit.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001116","en":"playbook trigger","fr":"déclencheur de guide","den":"A description of what starts a playbook: an alert or event matching stated conditions, a schedule, or a request by an analyst.","dfr":"Description de ce qui lance un guide : une alerte ou un événement répondant à des conditions données, un calendrier, ou une demande d'un analyste.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001117","en":"response action","fr":"action de réponse","den":"A directive that defines a kind of action a playbook may take, such as disabling an account, isolating a host or blocking a domain, with its risk class and the approval it needs. It is the definition, not an execution.","dfr":"Directive qui définit un type d'action qu'un guide peut entreprendre, comme désactiver un compte, isoler un hôte ou bloquer un domaine, avec sa classe de risque et l'approbation qu'elle exige. C'est la définition, et non une exécution.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001118","en":"approval gate","fr":"point d'approbation","den":"A directive that an action, or a class of actions, may be executed only after a stated authority has approved it, or under a stated pre-authorisation, for example when it targets a critical asset.","dfr":"Directive selon laquelle une action, ou une classe d'actions, ne peut être exécutée qu'après l'approbation d'une autorité précisée, ou en vertu d'une préautorisation précisée, par exemple lorsqu'elle vise un actif critique.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0001119","en":"approval decision","fr":"décision d'approbation","den":"A decision record granting or denying the execution of a response action, or pre-authorising a stated class of actions for a stated scope and period, by an identified authority.","dfr":"Relevé de décision qui accorde ou refuse l'exécution d'une action de réponse, ou qui préautorise une classe d'actions précisée pour un périmètre et une période donnés, par une autorité identifiée.","mod":"soar","parents":["CRGO_0000504"],"bucket":"ice","values":[]},{"id":"CRGO_0001120","en":"automation execution record","fr":"enregistrement d'exécution automatisée","den":"A record of one run of a playbook version: what triggered it, when it started and ended, its status and the investigation or incident it served. The full execution history stays in the operational store.","dfr":"Enregistrement d'une exécution d'une version de guide : ce qui l'a déclenchée, son début et sa fin, son état et l'enquête ou l'incident qu'elle a servi. L'historique complet reste dans le dépôt opérationnel.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001121","en":"action execution record","fr":"enregistrement d'exécution d'action","den":"A record of one attempt to carry out a response action on a target, with its time, status, the approval relied on and the evidence it produced.","dfr":"Enregistrement d'une tentative d'exécution d'une action de réponse sur une cible, avec son moment, son état, l'approbation invoquée et les preuves produites.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001122","en":"response evidence","fr":"preuve de réponse","den":"An evidence item recording that a response action was carried out and with what result, such as a system log entry or a screenshot of the changed configuration.","dfr":"Élément de preuve qui consigne qu'une action de réponse a été effectuée et avec quel résultat, comme une entrée de journal système ou une capture de la configuration modifiée.","mod":"soar","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0001123","en":"forensic artefact","fr":"artefact d'investigation numérique","den":"An evidence item collected for forensic analysis, such as a disk or memory image, kept under recorded custody with its integrity hash.","dfr":"Élément de preuve recueilli pour une analyse forensique, comme une image de disque ou de mémoire, conservé sous une garde consignée avec son empreinte d'intégrité.","mod":"soar","parents":["CRGO_0000036"],"bucket":"ice","values":[]},{"id":"CRGO_0001124","en":"incident impact","fr":"impact de l'incident","den":"A description of a consequence an incident had, or is estimated to have had, along one impact dimension, such as hours of service lost or the number of records exposed, with whether it is observed or estimated.","dfr":"Description d'une conséquence qu'un incident a eue, ou est estimé avoir eue, selon une dimension d'impact, comme les heures de service perdues ou le nombre d'enregistrements exposés, en précisant si elle est observée ou estimée.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001125","en":"incident communication","fr":"communication relative à l'incident","den":"A record of a notification or escalation about an incident to a stated audience, such as management, affected persons, customers or a regulator, with when it was sent and what it covered.","dfr":"Enregistrement d'un avis ou d'une transmission à un niveau supérieur concernant un incident, adressé à un public précisé, comme la direction, les personnes concernées, des clients ou une autorité, avec la date d'envoi et ce qu'il couvrait.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001126","en":"recovery verification","fr":"vérification du rétablissement","den":"A dated record that an asset or business process affected by an incident was checked to be restored to its expected operation, by whom and on what evidence.","dfr":"Enregistrement daté indiquant qu'un actif ou un processus d'affaires touché par un incident a été vérifié comme rétabli dans son fonctionnement attendu, par qui et sur quelles preuves.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0001127","en":"response effectiveness measurement","fr":"mesure de l'efficacité de la réponse","den":"A measurement of how quickly or well an incident or a set of incidents was handled, such as time to contain, for a stated metric and under a stated method.","dfr":"Mesure de la rapidité ou de la qualité avec laquelle un incident ou un ensemble d'incidents a été traité, comme le délai de confinement, pour un indicateur et selon une méthode précisés.","mod":"soar","parents":["https://www.commoncoreontologies.org/ont00001163"],"bucket":"ice","values":[]},{"id":"CRGO_0001128","en":"playbook simulation","fr":"simulation de guide","den":"A control assessment in which a playbook version is run in a test environment or exercise to check that it behaves as intended.","dfr":"Évaluation de mesure dans laquelle une version de guide est exécutée dans un environnement d'essai ou lors d'un exercice pour vérifier qu'elle se comporte comme prévu.","mod":"soar","parents":["CRGO_0000347"],"bucket":"process","values":[]},{"id":"CRGO_0001129","en":"detection status","fr":"état de la détection","den":"The lifecycle state of a detection rule.","dfr":"État du cycle de vie d'une règle de détection.","mod":"siem","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved (detection)","draft (detection)","enabled (detection)","retired (detection)","suppressed (detection)","testing (detection)"]},{"id":"CRGO_0001137","en":"alert disposition","fr":"décision sur l'alerte","den":"The conclusion of an analyst's triage of a security alert.","dfr":"Conclusion du tri d'une alerte de sécurité par un analyste.","mod":"siem","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["benign true positive","false positive","indeterminate (alert)","true positive","unreviewed"]},{"id":"CRGO_0001144","en":"coverage status","fr":"état de couverture","den":"The state of a detection coverage statement.","dfr":"État d'un énoncé de couverture de détection.","mod":"siem","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["degraded coverage","missing coverage","untested coverage","validated coverage"]},{"id":"CRGO_0001150","en":"telemetry health state","fr":"état de la télémétrie","den":"The state reported by a telemetry health observation.","dfr":"État indiqué par une observation de l'état de la télémétrie.","mod":"siem","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["degraded (telemetry)","healthy (telemetry)","silent (telemetry)","unknown (telemetry)"]},{"id":"CRGO_0001156","en":"information marking","fr":"marquage de l'information","den":"The sharing restriction attached to information, following the FIRST Traffic Light Protocol 2.0.","dfr":"Restriction de partage attachée à une information, selon le protocole TLP 2.0 de FIRST.","mod":"siem","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["TLP:AMBER","TLP:AMBER+STRICT","TLP:CLEAR","TLP:GREEN","TLP:RED"]},{"id":"CRGO_0001163","en":"case status","fr":"état du dossier","den":"The recorded stage of a security investigation.","dfr":"Étape consignée d'une enquête de sécurité.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["closed (case)","contained","investigating","new (case)","recovering","resolved (case)","triaged (case)"]},{"id":"CRGO_0001172","en":"execution status","fr":"état de l'exécution","den":"The state of an automation or action execution.","dfr":"État d'une exécution automatisée ou d'une exécution d'action.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["awaiting approval","cancelled (execution)","compensated","failed","pending (execution)","running","succeeded"]},{"id":"CRGO_0001181","en":"approval status","fr":"état de l'approbation","den":"The state of an approval decision for a response action.","dfr":"État d'une décision d'approbation d'une action de réponse.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approval denied","approval expired","approval granted","approval requested","approval revoked"]},{"id":"CRGO_0001188","en":"action risk class","fr":"classe de risque de l'action","den":"How much harm a response action could do if wrong, which sets the approval it needs.","dfr":"Préjudice qu'une action de réponse pourrait causer si elle était erronée, ce qui détermine l'approbation qu'elle exige.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["administrative action","containment action","destructive action","read-only action"]},{"id":"CRGO_0001194","en":"incident category","fr":"catégorie d'incident","den":"A broad category of an incident. CRGO's own scale; NIST SP 800-61 Rev. 3 sets none.","dfr":"Grande catégorie d'un incident. Échelle propre à CRGO; la publication NIST SP 800-61 Rév. 3 n'en fixe aucune.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["data exposure","denial of service","insider misuse","loss or theft","malware incident","misconfiguration exposure","social engineering","unauthorised access"]},{"id":"CRGO_0001204","en":"incident severity","fr":"gravité de l'incident","den":"The severity of an incident as rated by the responder. CRGO's own scale.","dfr":"Gravité d'un incident selon la cote attribuée par l'intervenant. Échelle propre à CRGO.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["critical severity","high severity","low severity","medium severity"]},{"id":"CRGO_0001210","en":"trigger kind","fr":"type de déclenc
