heur","den":"What kind of thing starts a playbook.","dfr":"Type de ce qui lance un guide.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["alert trigger","event trigger","manual trigger","scheduled trigger"]},{"id":"CRGO_0001216","en":"communication audience","fr":"destinataires de la communication","den":"Who an incident communication is addressed to.","dfr":"À qui s'adresse une communication relative à l'incident.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["affected persons","customers and partners","governing body (audience)","internal escalation","law enforcement","regulator (audience)"]},{"id":"CRGO_0001224","en":"response metric","fr":"indicateur de réponse","den":"What a response effectiveness measurement measures.","dfr":"Ce que mesure une mesure de l'efficacité de la réponse.","mod":"soar","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["dwell time","time to acknowledge","time to contain","time to detect","time to recover"]}],"ext":{"http://purl.obolibrary.org/obo/BFO_0000016":{"en":"disposition","parents":["http://purl.obolibrary.org/obo/BFO_0000017"]},"http://purl.obolibrary.org/obo/BFO_0000017":{"en":"realizable entity","parents":["http://purl.obolibrary.org/obo/BFO_0000020"]},"http://purl.obolibrary.org/obo/BFO_0000020":{"en":"specifically dependent continuant","parents":["http://purl.obolibrary.org/obo/BFO_0000002"]},"http://purl.obolibrary.org/obo/BFO_0000002":{"en":"continuant","parents":["http://purl.obolibrary.org/obo/BFO_0000001"]},"http://purl.obolibrary.org/obo/BFO_0000001":{"en":"entity","parents":[]},"https://www.commoncoreontologies.org/ont00000995":{"en":"Material Artifact","parents":["http://purl.obolibrary.org/obo/BFO_0000040"]},"http://purl.obolibrary.org/obo/BFO_0000040":{"en":"material entity","parents":["http://purl.obolibrary.org/obo/BFO_0000004"]},"http://purl.obolibrary.org/obo/BFO_0000004":{"en":"independent continuant","parents":["http://purl.obolibrary.org/obo/BFO_0000002"]},"http://www.w3.org/2004/02/skos/core#Concept":{"en":"Concept","parents":[]},"http://www.w3.org/ns/prov#Entity":{"en":"Entity","parents":[]},"http://purl.obolibrary.org/obo/BFO_0000015":{"en":"process","parents":["http://purl.obolibrary.org/obo/BFO_0000003"]},"http://purl.obolibrary.org/obo/BFO_0000003":{"en":"occurrent","parents":["http://purl.obolibrary.org/obo/BFO_0000001"]},"https://www.commoncoreontologies.org/ont00001180":{"en":"Organization","parents":["https://www.commoncoreontologies.org/ont00000300"]},"https://www.commoncoreontologies.org/ont00000300":{"en":"Group of Agents","parents":["http://purl.obolibrary.org/obo/BFO_0000027"]},"http://purl.obolibrary.org/obo/BFO_0000027":{"en":"object aggregate","parents":["http://purl.obolibrary.org/obo/BFO_0000040"]},"https://www.commoncoreontologies.org/ont00000192":{"en":"Facility","parents":["https://www.commoncoreontologies.org/ont00000995"]},"https://www.commoncoreontologies.org/ont00000974":{"en":"Plan","parents":["https://www.commoncoreontologies.org/ont00000965"]},"https://www.commoncoreontologies.org/ont00000965":{"en":"Prescriptive Information Content Entity","parents":["https://www.commoncoreontologies.org/ont00000958"]},"https://www.commoncoreontologies.org/ont00000958":{"en":"Information Content Entity","parents":["http://purl.obolibrary.org/obo/BFO_0000031"]},"http://purl.obolibrary.org/obo/BFO_0000031":{"en":"generically dependent continuant","parents":["http://purl.obolibrary.org/obo/BFO_0000002"]},"https://www.commoncoreontologies.org/ont00000853":{"en":"Descriptive Information Content Entity","parents":["https://www.commoncoreontologies.org/ont00000958"]},"http://purl.obolibrary.org/obo/BFO_0000023":{"en":"role","parents":["http://purl.obolibrary.org/obo/BFO_0000017"]},"https://www.commoncoreontologies.org/ont00000548":{"en":"Vulnerability","parents":["https://www.commoncoreontologies.org/ont00000997"]},"https://www.commoncoreontologies.org/ont00000997":{"en":"Disrupting Disposition","parents":["http://purl.obolibrary.org/obo/BFO_0000016"]},"https://www.commoncoreontologies.org/ont00000476":{"en":"Objective","parents":["https://www.commoncoreontologies.org/ont00000965"]},"https://www.commoncoreontologies.org/ont00000653":{"en":"Algorithm","parents":["https://www.commoncoreontologies.org/ont00000965"]},"https://www.commoncoreontologies.org/ont00001163":{"en":"Measurement Information Content Entity","parents":["https://www.commoncoreontologies.org/ont00000853"]},"https://www.commoncoreontologies.org/ont00000228":{"en":"Planned Act","parents":["https://www.commoncoreontologies.org/ont00000005"]},"https://www.commoncoreontologies.org/ont00000005":{"en":"Act","parents":["http://purl.obolibrary.org/obo/BFO_0000015"]}},"oprops":[{"id":"CRGO_0000183","en":"valuation of","fr":"évaluation de","den":"Relates an asset valuation to the entity it values.","dfr":"Relie une évaluation d'actif à l'entité qu'elle évalue.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["http://purl.obolibrary.org/obo/BFO_0000001"],"sup":[]},{"id":"CRGO_0000184","en":"valued by","fr":"évaluée par","den":"Relates an asset valuation to the organisation for which the value holds.","dfr":"Relie une évaluation d'actif à l'organisation pour laquelle cette valeur s'applique.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000185","en":"has owner","fr":"a pour responsable","den":"Relates an asset valuation, control measure, initiative or indicator to the agent accountable for it.","dfr":"Relie une évaluation d'actif, une mesure de contrôle, une initiative ou un indicateur à l'agent qui en est responsable.","mod":"core","dom":[],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000186","en":"has confidentiality requirement","fr":"a pour exigence de confidentialité","den":"Gives the confidentiality requirement level recorded in an asset valuation.","dfr":"Indique le niveau d'exigence de confidentialité consigné dans une évaluation d'actif.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["https://w3id.org/crgo/CRGO_0000084"],"sup":[]},{"id":"CRGO_0000187","en":"has integrity requirement","fr":"a pour exigence d'intégrité","den":"Gives the integrity requirement level recorded in an asset valuation.","dfr":"Indique le niveau d'exigence d'intégrité consigné dans une évaluation d'actif.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["https://w3id.org/crgo/CRGO_0000084"],"sup":[]},{"id":"CRGO_0000188","en":"has availability requirement","fr":"a pour exigence de disponibilité","den":"Gives the availability requirement level recorded in an asset valuation.","dfr":"Indique le niveau d'exigence de disponibilité consigné dans une évaluation d'actif.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["https://w3id.org/crgo/CRGO_0000084"],"sup":[]},{"id":"CRGO_0000189","en":"supports process","fr":"soutient le processus","den":"Relates an asset to a business process that depends on it.","dfr":"Relie un actif à un processus d'affaires qui en dépend.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000001"],"rng":["https://w3id.org/crgo/CRGO_0000009"],"sup":[]},{"id":"CRGO_0000190","en":"supports objective","fr":"soutient l'objectif","den":"Relates a business process to a business objective it contributes to.","dfr":"Relie un processus d'affaires à un objectif d'affaires auquel il contribue.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000009"],"rng":["https://w3id.org/crgo/CRGO_0000010"],"sup":[]},{"id":"CRGO_0000191","en":"relies on asset","fr":"repose sur l'actif","den":"Relates an asset to another asset it needs in order to function, such as an application and its hosting service.","dfr":"Relie un actif à un autre actif dont il a besoin pour fonctionner, comme une application et son service d'hébergement.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000001"],"rng":["https://w3id.org/crgo/CRGO_0000001"],"sup":[]},{"id":"CRGO_0000192","en":"provided by","fr":"fourni par","den":"Relates an asset to the third-party organisation that supplies or operates it.","dfr":"Relie un actif à l'organisation tierce qui le fournit ou l'exploite.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000001"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000193","en":"housed in","fr":"hébergé dans","den":"Relates an asset to the facility that houses it.","dfr":"Relie un actif à l'installation qui l'abrite.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000001"],"rng":["https://w3id.org/crgo/CRGO_0000008"],"sup":[]},{"id":"CRGO_0000194","en":"has threat source type","fr":"a pour type de source de menace","den":"Classifies a threat source role or a threat source description by NIST SP 800-30 category.","dfr":"Classe un rôle de source de menace ou une description de source de menace selon la catégorie de NIST SP 800-30.","mod":"core","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000090"],"sup":[]},{"id":"CRGO_0000195","en":"initiated by","fr":"déclenché par","den":"Relates a risk scenario to the entity that would initiate it: the bearer of a threat source role, such as a person, organisation, artifact or natural feature. Use hasThreatSourceDescription when only the kind of source is known.","dfr":"Relie un scénario de risque à l'entité qui le déclencherait : le porteur d'un rôle de source de menace, par exemple une personne, une organisation, un artefact ou un élément naturel. Utiliser hasThreatSourceDescription lorsque seul le type de source est connu.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["http://purl.obolibrary.org/obo/BFO_0000001"],"sup":[]},{"id":"CRGO_0000196","en":"has threat event","fr":"a pour événement de menace","den":"Relates a risk scenario to the threat event it describes.","dfr":"Relie un scénario de risque à l'événement de menace qu'il décrit.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000014"],"sup":[]},{"id":"CRGO_0000197","en":"exploits","fr":"exploite","den":"Relates a risk scenario to an identified vulnerability or predisposing condition, borne by a material asset or an organisation, that its threat event takes advantage of. Described weaknesses use hasVulnerabilityDescription.","dfr":"Relie un scénario de risque à une vulnérabilité ou à une condition prédisposante identifiée, portée par un actif matériel ou une organisation, dont profite son événement de menace. Les faiblesses décrites utilisent hasVulnerabilityDescription.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["http://purl.obolibrary.org/obo/BFO_0000016"],"sup":[]},{"id":"CRGO_0000198","en":"affects asset","fr":"touche l'actif","den":"Relates a risk scenario to an asset that would be harmed.","dfr":"Relie un scénario de risque à un actif qui serait atteint.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000001"],"sup":[]},{"id":"CRGO_0000199","en":"affects process","fr":"touche le processus","den":"Relates a risk scenario to a business process that would be disrupted.","dfr":"Relie un scénario de risque à un processus d'affaires qui serait perturbé.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000009"],"sup":[]},{"id":"CRGO_0000200","en":"has consequence","fr":"a pour conséquence","den":"Relates a risk scenario to one of its consequences.","dfr":"Relie un scénario de risque à l'une de ses conséquences.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000027"],"sup":[]},{"id":"CRGO_0000201","en":"has impact dimension","fr":"a pour dimension d'impact","den":"Gives the impact dimension of a consequence.","dfr":"Indique la dimension d'impact d'une conséquence.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000027"],"rng":["https://w3id.org/crgo/CRGO_0000072"],"sup":[]},{"id":"CRGO_0000202","en":"has step","fr":"a pour étape","den":"Relates a risk scenario to a step of its event sequence.","dfr":"Relie un scénario de risque à une étape de sa séquence d'événements.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000026"],"sup":[]},{"id":"CRGO_0000203","en":"next step","fr":"étape suivante","den":"Relates a scenario step to the step that immediately follows it.","dfr":"Relie une étape de scénario à l'étape qui la suit immédiatement.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000026"],"rng":["https://w3id.org/crgo/CRGO_0000026"],"sup":[]},{"id":"CRGO_0000204","en":"refines","fr":"précise","den":"Relates a risk scenario to a more generic scenario it was derived from, such as a selected scenario to its candidate or a candidate to a library scenario.","dfr":"Relie un scénario de risque au scénario plus générique dont il est dérivé, comme un scénario retenu à son candidat ou un candidat à un scénario de bibliothèque.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000205","en":"has stakeholder","fr":"a pour partie prenante","den":"Relates a risk scenario to an agent with an interest in it.","dfr":"Relie un scénario de risque à un agent qui y a un intérêt.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000206","en":"has risk owner","fr":"a pour propriétaire du risque","den":"Relates a risk scenario to the agent accountable for managing it.","dfr":"Relie un scénario de risque à l'agent responsable de sa gestion.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000207","en":"mitigated by","fr":"atténué par","den":"Relates a risk scenario to a control measure that reduces its likelihood or consequences.","dfr":"Relie un scénario de risque à une mesure de contrôle qui en réduit la probabilité ou les conséquences.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0000208","en":"implements control","fr":"met en œuvre le contrôle","den":"Relates a control measure to the control it applies.","dfr":"Relie une mesure de contrôle au contrôle qu'elle applique.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000020"],"rng":["https://w3id.org/crgo/CRGO_0000019"],"sup":[]},{"id":"CRGO_0000209","en":"protects asset","fr":"protège l'actif","den":"Relates a control measure to an asset it protects.","dfr":"Relie une mesure de contrôle à un actif qu'elle protège.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000020"],"rng":["https://w3id.org/crgo/CRGO_0000001"],"sup":[]},{"id":"CRGO_0000210","en":"has control status","fr":"a pour statut de contrôle","den":"Gives the implementation status of a control measure.","dfr":"Indique le statut de mise en œuvre d'une mesure de contrôle.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000020"],"rng":["https://w3id.org/crgo/CRGO_0000096"],"sup":[]},{"id":"CRGO_0000211","en":"has control function","fr":"a pour fonction de contrôle","den":"Gives the function a control, control measure or initiative serves.","dfr":"Indique la fonction que remplit un contrôle, une mesure de contrôle ou une initiative.","mod":"core","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000133"],"sup":[]},{"id":"CRGO_0000212","en":"maps to requirement","fr":"correspond à l'exigence","den":"Relates a control, framework requirement or legal obligation to a framework requirement or obligation it satisfies, contributes to or corresponds with.","dfr":"Relie un contrôle, une exigence de référentiel ou une obligation légale à une exigence ou à une obligation qu'il satisfait, à laquelle il contribue ou à laquelle il correspond.","mod":"core","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000213","en":"has evidence","fr":"a pour preuve","den":"Relates an estimate, control measure or other statement to an evidence item that supports it.","dfr":"Relie une estimation, une mesure de contrôle ou une autre affirmation à un élément de preuve qui l'appuie.","mod":"core","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000036"],"sup":[]},{"id":"CRGO_0000214","en":"has evidence basis","fr":"a pour fondement","den":"Gives the kind of support behind an evidence item.","dfr":"Indique la nature de l'appui d'un élément de preuve.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000036"],"rng":["https://w3id.org/crgo/CRGO_0000116"],"sup":[]},{"id":"CRGO_0000215","en":"includes scenario","fr":"comprend le scénario","den":"Relates a risk assessment to a scenario screened or analysed in it.","dfr":"Relie une appréciation du risque à un scénario présélectionné ou analysé dans son cadre.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000028"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000216","en":"assesses organisation","fr":"porte sur l'organisation","den":"Relates a risk assessment to the organisation whose risk it assesses.","dfr":"Relie une appréciation du risque à l'organisation dont elle apprécie le risque.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000028"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000217","en":"has risk appetite","fr":"a pour appétence au risque","den":"Relates a risk assessment to the risk appetite statement it applies.","dfr":"Relie une appréciation du risque à l'énoncé d'appétence au risque qu'elle applique.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000028"],"rng":["https://w3id.org/crgo/CRGO_0000029"],"sup":[]},{"id":"CRGO_0000218","en":"uses calculation method","fr":"utilise la méthode de calcul","den":"Relates a risk assessment to the calculation method it applies to all its scenarios.","dfr":"Relie une appréciation du risque à la méthode de calcul appliquée à tous ses scénarios.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000028"],"rng":["https://w3id.org/crgo/CRGO_0000059"],"sup":[]},{"id":"CRGO_0000219","en":"has treatment decision","fr":"a pour décision de traitement","den":"Relates a risk scenario to a decision on how it is treated.","dfr":"Relie un scénario de risque à une décision sur son traitement.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000030"],"sup":[]},{"id":"CRGO_0000220","en":"has treatment option","fr":"a pour option de traitement","den":"Gives the treatment option a decision chooses.","dfr":"Indique l'option de traitement retenue par une décision.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000030"],"rng":["https://w3id.org/crgo/CRGO_0000141"],"sup":[]},{"id":"CRGO_0000221","en":"decided by","fr":"décidé par","den":"Relates a treatment decision to the agent who made it.","dfr":"Relie une décision de traitement à l'agent qui l'a prise.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000030"],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000222","en":"addresses","fr":"vise","den":"Relates a treatment initiative to a risk scenario it is meant to reduce.","dfr":"Relie une initiative de traitement à un scénario de risque qu'elle doit réduire.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000032"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000223","en":"includes control measure","fr":"comprend la mesure de contrôle","den":"Relates a treatment initiative to a control measure it will put in place.","dfr":"Relie une initiative de traitement à une mesure de contrôle qu'elle mettra en place.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000032"],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0000224","en":"has priority","fr":"a pour priorité","den":"Gives the priority of a treatment initiative.","dfr":"Indique la priorité d'une initiative de traitement.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000032"],"rng":["https://w3id.org/crgo/CRGO_0000128"],"sup":[]},{"id":"CRGO_0000225","en":"allocation of","fr":"répartition de","den":"Relates a cost allocation to the initiative whose cost it shares out.","dfr":"Relie une répartition des coûts à l'initiative dont elle répartit le coût.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000033"],"rng":["https://w3id.org/crgo/CRGO_0000032"],"sup":[]},{"id":"CRGO_0000226","en":"allocated to","fr":"imputée à","den":"Relates a cost allocation to the risk scenario it charges.","dfr":"Relie une répartition des coûts au scénario de risque auquel elle impute des coûts.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000033"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000227","en":"monitors","fr":"surveille","den":"Relates a key risk indicator to a risk scenario, control measure or asset it monitors.","dfr":"Relie un indicateur clé de risque à un scénario de risque, à une mesure de contrôle ou à un actif qu'il surveille.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000034"],"rng":[],"sup":[]},{"id":"CRGO_0000228","en":"triggers obligation","fr":"déclenche l'obligation","den":"Relates a risk scenario or incident to a legal obligation its realisation would trigger, such as notice to the CAI.","dfr":"Relie un scénario de risque ou un incident à une obligation légale que sa réalisation déclencherait, comme l'avis à la CAI.","mod":"core","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000022"],"sup":[]},{"id":"CRGO_0000229","en":"matches threat event","fr":"correspond à l'événement de menace","den":"Relates an incident to the threat event description it is an occurrence of.","dfr":"Relie un incident à la description d'événement de menace dont il est une occurrence.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000015"],"rng":["https://w3id.org/crgo/CRGO_0000014"],"sup":[]},{"id":"CRGO_0000230","en":"budget of","fr":"budget de","den":"Relates a budget calibration to the organisation whose budget it calibrates.","dfr":"Relie un étalonnage du budget à l'organisation dont il étalonne le budget.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000035"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000231","en":"estimate of","fr":"estimation de","den":"Relates an estimate to the scenario, control measure or other entity it gives a value for.","dfr":"Relie une estimation au scénario, à la mesure de contrôle ou à l'autre entité dont elle donne une valeur.","mod":"measure","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["http://purl.obolibrary.org/obo/BFO_0000001"],"sup":["https://www.commoncoreontologies.org/ont00001808"]},{"id":"CRGO_0000232","en":"assessed in","fr":"évaluée dans","den":"Relates an estimate to the risk assessment in which it was made.","dfr":"Relie une estimation à l'appréciation du risque dans laquelle elle a été produite.","mod":"measure","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000028"],"sup":[]},{"id":"CRGO_0000233","en":"on scale","fr":"sur l'échelle","den":"Gives the measurement scale of an estimate.","dfr":"Indique l'échelle de mesure d'une estimation.","mod":"measure","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000038"],"sup":[]},{"id":"CRGO_0000234","en":"has confidence","fr":"a pour niveau de confiance","den":"Gives the analyst's confidence in an estimate.","dfr":"Indique la confiance de l'analyste dans une estimation.","mod":"measure","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000061"],"sup":[]},{"id":"CRGO_0000235","en":"has risk stage","fr":"a pour stade du risque","den":"States whether an estimate applies before or after treatment.","dfr":"Indique si une estimation s'applique avant ou après le traitement.","mod":"measure","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000101"],"sup":[]},{"id":"CRGO_0000236","en":"for criterion","fr":"pour le critère","den":"Gives the screening criterion a screening score rates.","dfr":"Indique le critère de présélection que note un score.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000039"],"rng":["https://w3id.org/crgo/CRGO_0000147"],"sup":[]},{"id":"CRGO_0000237","en":"used input","fr":"a utilisé l'intrant","den":"Relates a computed risk quantity to an estimate used to compute it.","dfr":"Relie une quantité de risque calculée à une estimation utilisée pour la calculer.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000050"],"rng":["https://w3id.org/crgo/CRGO_0000037"],"sup":[]},{"id":"CRGO_0000238","en":"generated by","fr":"produite par","den":"Relates a computed risk quantity to the calculation activity that produced it.","dfr":"Relie une quantité de risque calculée à l'activité de calcul qui l'a produite.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000050"],"rng":["https://w3id.org/crgo/CRGO_0000058"],"sup":[]},{"id":"CRGO_0000239","en":"uses method","fr":"utilise la méthode","den":"Relates a calculation activity to the method it executes.","dfr":"Relie une activité de calcul à la méthode qu'elle exécute.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000058"],"rng":["https://w3id.org/crgo/CRGO_0000059"],"sup":[]},{"id":"CRGO_0000240","en":"has tolerance classification","fr":"a pour classification de tolérance","den":"Gives the tolerance classification of a risk-to-tolerance ratio.","dfr":"Indique la classification de tolérance d'un ratio risque/tolérance.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000055"],"rng":["https://w3id.org/crgo/CRGO_0000105"],"sup":[]},{"id":"CRGO_0000241","en":"in sensitivity case","fr":"dans le cas de sensibilité","den":"Relates an estimate to the sensitivity case it belongs to; estimates used as given may link to a central case or to none.","dfr":"Relie une estimation au cas de sensibilité auquel elle appartient; les estimations utilisées telles quelles peuvent être reliées à un cas central ou à aucun.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000060"],"sup":[]},{"id":"CRGO_0000242","en":"has case type","fr":"a pour type de cas","den":"Gives the direction of a sensitivity case.","dfr":"Indique le sens d'un cas de sensibilité.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000060"],"rng":["https://w3id.org/crgo/CRGO_0000123"],"sup":[]},{"id":"CRGO_0000243","en":"case of","fr":"cas de","den":"Relates a sensitivity case to the scenario it varies.","dfr":"Relie un cas de sensibilité au scénario qu'il fait varier.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000060"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000244","en":"has selection disposition","fr":"a pour décision de présélection","den":"Gives the screening outcome of an assessment scenario.","dfr":"Indique le résultat de présélection d'un scénario d'évaluation.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000025"],"rng":["https://w3id.org/crgo/CRGO_0000110"],"sup":[]},{"id":"CRGO_0000245","en":"has escalation flag","fr":"a pour signal d'escalade","den":"Relates an assessment scenario to an escalation flag that applies to it.","dfr":"Relie un scénario d'évaluation à un signal d'escalade qui s'y applique.","mod":"crg","dom":["https://w3id.org/crgo/CRGO_0000025"],"rng":["https://w3id.org/crgo/CRGO_0000161"],"sup":[]},{"id":"CRGO_0000246","en":"has scenario category","fr":"a pour catégorie de scénario","den":"Relates a risk scenario to a category of the controlled scenario category list.","dfr":"Relie un scénario de risque à une catégorie de la liste contrôlée des catégories de scénarios.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["http://www.w3.org/2004/02/skos/core#Concept"],"sup":[]},{"id":"CRGO_0000293","en":"weakness of","fr":"faiblesse de","den":"Relates a vulnerability, vulnerability description or predisposing condition to the asset, organisation or process it is a weakness of. Shortcut for BFO 'inheres in', which cannot be used when the asset is software or information: in BFO-2020 a disposition can inhere only in a material bearer, so the weakness of a software asset strictly inheres in the copies or devices that carry it.","dfr":"Relie une vulnérabilité ou une condition prédisposante à l'actif, à l'organisation ou au processus dont elle est une faiblesse. Raccourci de « inheres in » de BFO, inutilisable lorsque l'actif est un logiciel ou de l'information : dans BFO-2020, une disposition ne peut résider que dans un porteur matériel, de sorte que la faiblesse d'un actif logiciel réside au sens strict dans les copies ou les appareils qui le portent.","mod":"core","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000318","en":"has threat source description","fr":"a pour description de source de menace","den":"Relates a risk scenario to a description of the kind of threat source that would initiate it.","dfr":"Relie un scénario de risque à la description du type de source de menace qui le déclencherait.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000294"],"sup":[]},{"id":"CRGO_0000319","en":"has vulnerability description","fr":"a pour description de vulnérabilité","den":"Relates a risk scenario to a description of a weakness or predisposing condition it relies on.","dfr":"Relie un scénario de risque à la description d'une faiblesse ou d'une condition prédisposante sur laquelle il repose.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000295"],"sup":[]},{"id":"CRGO_0000320","en":"has control gap","fr":"a pour lacune de contrôle","den":"Relates a risk scenario to a control gap finding it is anchored on.","dfr":"Relie un scénario de risque au constat de lacune de contrôle sur lequel il repose.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000018"],"sup":[]},{"id":"CRGO_0000321","en":"missing control","fr":"contrôle manquant","den":"Relates a control gap finding to the control found absent or inadequate.","dfr":"Relie un constat de lacune de contrôle au contrôle jugé absent ou insuffisant.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000018"],"rng":["https://w3id.org/crgo/CRGO_0000019"],"sup":[]},{"id":"CRGO_0000322","en":"affects asset category","fr":"touche la catégorie d'actifs","den":"Relates a risk scenario, typically a library scenario, to a category of asset it would harm.","dfr":"Relie un scénario de risque, généralement de bibliothèque, à une catégorie d'actifs qu'il atteindrait.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["https://w3id.org/crgo/CRGO_0000302"],"sup":[]},{"id":"CRGO_0000323","en":"has asset tier","fr":"a pour rang d'actif","den":"States, in an asset valuation, whether the asset is primary or supporting.","dfr":"Indique, dans une évaluation d'actif, si l'actif est principal ou de soutien.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000011"],"rng":["https://w3id.org/crgo/CRGO_0000314"],"sup":[]},{"id":"CRGO_0000324","en":"part of framework","fr":"fait partie du référentiel","den":"Relates a framework requirement or legal obligation to the framework, standard or law that states it.","dfr":"Relie une exigence de référentiel ou une obligation légale au référentiel, à la norme ou à la loi qui l'énonce.","mod":"core","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000296"],"sup":[]},{"id":"CRGO_0000325","en":"has external reference","fr":"a pour référence externe","den":"Relates a description or control to a concept in an external catalogue, such as an ATT&CK technique, a CWE weakness, a CAPEC pattern or a CVE record.","dfr":"Relie une description ou un contrôle à un concept d'un catalogue externe, comme une technique ATT&CK, une faiblesse CWE, un patron CAPEC ou un enregistrement CVE.","mod":"core","dom":[],"rng":["http://www.w3.org/2004/02/skos/core#Concept"],"sup":[]},{"id":"CRGO_0000335","en":"has relevant requirement","fr":"a pour exigence pertinente","den":"Relates a risk scenario to a requirement of a control framework, such as a NIST CSF 2.0 subcategory, a NIST SP 800-53 control or an ISO/IEC 27002 control, whose implementation would prevent, detect or limit the scenario.","dfr":"Relie un scénario de risque à une exigence d'un référentiel de mesures, comme une sous-catégorie du NIST CSF 2.0, une mesure du NIST SP 800-53 ou une mesure de l'ISO/IEC 27002, dont la mise en œuvre préviendrait, détecterait ou limiterait le scénario.","mod":"core","dom":["https://w3id.org/crgo/CRGO_0000023"],"rng":["http://www.w3.org/2004/02/skos/core#Concept"],"sup":[]},{"id":"CRGO_0000407","en":"has source record","fr":"a pour notice de source","den":"Relates a vocabulary, dataset, observation or other record to the source record of the content it was imported or derived from.","dfr":"Relie un vocabulaire, un jeu de données, une observation ou un autre enregistrement à la notice de source du contenu dont il est importé ou dérivé.","mod":"evidence","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000337"],"sup":["http://www.w3.org/ns/prov#hadPrimarySource"]},{"id":"CRGO_0000408","en":"observation of","fr":"observation de","den":"Relates an observation to the entity it reports on, such as a published vulnerability.","dfr":"Relie une observation à l'entité sur laquelle elle porte, comme une vulnérabilité publiée.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000338"],"rng":[],"sup":["https://www.commoncoreontologies.org/ont00001808"]},{"id":"CRGO_0000409","en":"depends on assumption","fr":"repose sur l'hypothèse","den":"Relates an estimate, assessment, determination or decision to an assumption it takes as true.","dfr":"Relie une estimation, une appréciation, un constat ou une décision à une hypothèse qu'il tient pour vraie.","mod":"evidence","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000339"],"sup":[]},{"id":"CRGO_0000410","en":"has organisation type","fr":"a pour type d'organisation","den":"Gives the legal category of an organisation.","dfr":"Indique la catégorie juridique d'une organisation.","mod":"org","dom":["https://www.commoncoreontologies.org/ont00001180"],"rng":["https://w3id.org/crgo/CRGO_0000355"],"sup":[]},{"id":"CRGO_0000411","en":"established in","fr":"établie dans","den":"Relates an organisation to a jurisdiction where it has an establishment.","dfr":"Relie une organisation à une juridiction où elle a un établissement.","mod":"org","dom":["https://www.commoncoreontologies.org/ont00001180"],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000412","en":"offers goods or services to persons in","fr":"offre des biens ou services aux personnes situées dans","den":"Relates an organisation to a jurisdiction whose residents it targets with goods or services, paid or not.","dfr":"Relie une organisation à une juridiction dont elle cible les résidents par des biens ou services, payants ou non.","mod":"org","dom":["https://www.commoncoreontologies.org/ont00001180"],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000413","en":"monitors behaviour of persons in","fr":"suit le comportement des personnes situées dans","den":"Relates an organisation to a jurisdiction in which it monitors the behaviour of persons, such as by online tracking or profiling.","dfr":"Relie une organisation à une juridiction dans laquelle elle suit le comportement des personnes, par exemple par traçage en ligne ou profilage.","mod":"org","dom":["https://www.commoncoreontologies.org/ont00001180"],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000414","en":"carried out by","fr":"exercée par","den":"Relates a processing activity to the organisation that carries it out.","dfr":"Relie une activité de traitement à l'organisation qui l'exerce.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000341"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000415","en":"processes data category","fr":"traite la catégorie de données","den":"Relates a processing activity to a category of personal information it handles.","dfr":"Relie une activité de traitement à une catégorie de renseignements personnels qu'elle traite.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000341"],"rng":["https://w3id.org/crgo/CRGO_0000366"],"sup":[]},{"id":"CRGO_0000416","en":"has processing role","fr":"a pour rôle dans le traitement","den":"Gives the role the organisation carrying out a processing activity plays in it.","dfr":"Indique le rôle que joue dans une activité de traitement l'organisation qui l'exerce.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000341"],"rng":["https://w3id.org/crgo/CRGO_0000362"],"sup":[]},{"id":"CRGO_0000417","en":"data subjects in","fr":"personnes concernées situées dans","den":"Relates a processing activity to a jurisdiction where persons whose information it handles are located.","dfr":"Relie une activité de traitement à une juridiction où se trouvent des personnes dont elle traite les renseignements.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000341"],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000418","en":"transfers personal information to","fr":"communique des renseignements personnels vers","den":"Relates a processing activity to a jurisdiction where personal information is disclosed to, or stored by, a recipient.","dfr":"Relie une activité de traitement à une juridiction où des renseignements personnels sont communiqués à un destinataire ou conservés par lui.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000341"],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000419","en":"supplier to","fr":"fournisseur de","den":"Relates a supplier role to the organisation that depends on what its bearer supplies.","dfr":"Relie un rôle de fournisseur à l'organisation qui dépend de ce que fournit le porteur du rôle.","mod":"org","dom":["https://w3id.org/crgo/CRGO_0000342"],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000420","en":"has jurisdiction","fr":"a pour juridiction","den":"Relates a legal instrument, applicability assessment or compliance determination to its jurisdiction.","dfr":"Relie un instrument juridique, une évaluation de l'applicabilité ou un constat de conformité à sa juridiction.","mod":"grc","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000348"],"sup":[]},{"id":"CRGO_0000421","en":"has instrument kind","fr":"a pour type d'instrument","den":"Gives the kind of a legal instrument.","dfr":"Indique le type d'un instrument juridique.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000343"],"rng":["https://w3id.org/crgo/CRGO_0000376"],"sup":[]},{"id":"CRGO_0000422","en":"provision of","fr":"disposition de","den":"Relates a provision, such as a concept of a CRGO legal vocabulary, to the legal instrument it belongs to.","dfr":"Relie une disposition, comme un concept d'un vocabulaire juridique de CRGO, à l'instrument juridique dont elle fait partie.","mod":"grc","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000343"],"sup":[]},{"id":"CRGO_0000423","en":"has in-force period","fr":"a pour période de vigueur","den":"Relates a legal instrument to the OWL-Time interval during which it is in force; the interval has no end while the instrument is not repealed.","dfr":"Relie un instrument juridique à l'intervalle OWL-Time pendant lequel il est en vigueur; l'intervalle n'a pas de fin tant que l'instrument n'est pas abrogé.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000343"],"rng":["http://www.w3.org/2006/time#ProperInterval"],"sup":[]},{"id":"CRGO_0000424","en":"condition of","fr":"condition de","den":"Relates an applicability condition to the instrument, provision or policy statement whose application it governs.","dfr":"Relie une condition d'applicabilité à l'instrument, à la disposition ou à l'énoncé de politique dont elle régit l'application.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000344"],"rng":[],"sup":[]},{"id":"CRGO_0000425","en":"has condition kind","fr":"a pour type de condition","den":"Gives the kind of fact an applicability condition tests.","dfr":"Indique le type de fait que vérifie une condition d'applicabilité.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000344"],"rng":["https://w3id.org/crgo/CRGO_0000394"],"sup":[]},{"id":"CRGO_0000426","en":"applicability of","fr":"applicabilité de","den":"Relates an applicability assessment to the instrument, provision or policy statement assessed.","dfr":"Relie une évaluation de l'applicabilité à l'instrument, à la disposition ou à l'énoncé de politique évalué.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000345"],"rng":[],"sup":[]},{"id":"CRGO_0000427","en":"concerns organisation","fr":"concerne l'organisation","den":"Relates an applicability assessment, compliance determination or control assessment to the organisation it is about.","dfr":"Relie une évaluation de l'applicabilité, un constat de conformité ou une évaluation de mesure à l'organisation qu'il concerne.","mod":"grc","dom":[],"rng":["https://www.commoncoreontologies.org/ont00001180"],"sup":[]},{"id":"CRGO_0000428","en":"has applicability state","fr":"a pour état d'applicabilité","den":"Gives the state reached by an applicability assessment.","dfr":"Indique l'état retenu par une évaluation de l'applicabilité.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000345"],"rng":["https://w3id.org/crgo/CRGO_0000381"],"sup":[]},{"id":"CRGO_0000429","en":"condition met","fr":"condition remplie","den":"Relates an applicability assessment to a condition found met.","dfr":"Relie une évaluation de l'applicabilité à une condition jugée remplie.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000345"],"rng":["https://w3id.org/crgo/CRGO_0000344"],"sup":[]},{"id":"CRGO_0000430","en":"condition not met","fr":"condition non remplie","den":"Relates an applicability assessment to a condition found not met.","dfr":"Relie une évaluation de l'applicabilité à une condition jugée non remplie.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000345"],"rng":["https://w3id.org/crgo/CRGO_0000344"],"sup":[]},{"id":"CRGO_0000431","en":"condition undetermined","fr":"condition indéterminée","den":"Relates an applicability assessment to a condition that could not be evaluated because a needed fact is missing.","dfr":"Relie une évaluation de l'applicabilité à une condition qui n'a pu être évaluée faute d'un fait nécessaire.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000345"],"rng":["https://w3id.org/crgo/CRGO_0000344"],"sup":[]},{"id":"CRGO_0000432","en":"compliance with","fr":"conformité à","den":"Relates a compliance determination to the provision or obligation determined.","dfr":"Relie un constat de conformité à la disposition ou à l'obligation visée.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000346"],"rng":[],"sup":[]},{"id":"CRGO_0000433","en":"has compliance state","fr":"a pour état de conformité","den":"Gives the state recorded by a compliance determination.","dfr":"Indique l'état consigné par un constat de conformité.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000346"],"rng":["https://w3id.org/crgo/CRGO_0000387"],"sup":[]},{"id":"CRGO_0000434","en":"based on control assessment","fr":"fondé sur l'évaluation de mesure","den":"Relates a compliance determination to a control assessment it relies on.","dfr":"Relie un constat de conformité à une évaluation de mesure de sécurité sur laquelle il s'appuie.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000346"],"rng":["https://w3id.org/crgo/CRGO_0000347"],"sup":[]},{"id":"CRGO_0000435","en":"assessed by","fr":"évalué par","den":"Relates an applicability assessment, compliance determination or control assessment to the agent responsible for it.","dfr":"Relie une évaluation de l'applicabilité, un constat de conformité ou une évaluation de mesure à l'agent qui en est responsable.","mod":"grc","dom":[],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000436","en":"evaluates control measure","fr":"évalue la mesure","den":"Relates a control assessment to the control measure it tests.","dfr":"Relie une évaluation de mesure de sécurité à la mesure appliquée qu'elle teste.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000347"],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0000437","en":"has test result","fr":"a pour résultat d'évaluation","den":"Gives the result recorded by a control assessment.","dfr":"Indique le résultat consigné par une évaluation de mesure de sécurité.","mod":"grc","dom":["https://w3id.org/crgo/CRGO_0000347"],"rng":["https://w3id.org/crgo/CRGO_0000401"],"sup":[]},{"id":"CRGO_0000438","en":"technique mitigated by control","fr":"technique atténuée par le contrôle","den":"Relates an ATT&CK technique to an SP 800-53 control that can mitigate it, as mapped by MITRE CTID.","dfr":"Relie une technique ATT&CK à un contrôle SP 800-53 qui peut l'atténuer, selon la correspondance de MITRE CTID.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000439","en":"technique countered by defensive technique","fr":"technique contrée par la technique défensive","den":"Relates an ATT&CK technique to a D3FEND defensive technique that can counter it.","dfr":"Relie une technique ATT&CK à une technique défensive D3FEND qui peut la contrer.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000440","en":"attack pattern exploits weakness","fr":"patron d'attaque exploitant la faiblesse","den":"Relates a CAPEC attack pattern to a CWE weakness it exploits, as referenced by CAPEC.","dfr":"Relie un patron d'attaque CAPEC à une faiblesse CWE qu'il exploite, selon les références de CAPEC.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000441","en":"attack pattern related to technique","fr":"patron d'attaque lié à la technique","den":"Relates a CAPEC attack pattern to an ATT&CK technique it references.","dfr":"Relie un patron d'attaque CAPEC à une technique ATT&CK qu'il cite.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000442","en":"vulnerability is an instance of weakness","fr":"vulnérabilité relevant de la faiblesse","den":"Relates a CVE in the KEV catalogue to a CWE weakness it is an instance of, as given by CISA.","dfr":"Relie une CVE du catalogue KEV à une faiblesse CWE dont elle relève, selon la CISA.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000443","en":"vulnerability associated with technique","fr":"vulnérabilité associée à la technique","den":"Relates a CVE in the KEV catalogue to an ATT&CK technique used to exploit it or describing its impact, as mapped by MITRE CTID; the mapping type is in the annotation.","dfr":"Relie une CVE du catalogue KEV à une technique ATT&CK servant à l'exploiter ou décrivant son impact, selon MITRE CTID; le type de correspondance est dans l'annotation.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000444","en":"subcategory supported by control","fr":"sous-catégorie appuyée par le contrôle","den":"Relates a NIST CSF 2.0 element to an SP 800-53 control that supports it.","dfr":"Relie un élément du NIST CSF 2.0 à un contrôle SP 800-53 qui l'appuie.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000445","en":"control corresponds to control","fr":"contrôle correspondant au contrôle","den":"Relates an SP 800-53 control to an ISO/IEC 27002 control that NIST OLIR relates to it.","dfr":"Relie un contrôle SP 800-53 à un contrôle ISO/IEC 27002 que NIST OLIR y rattache.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000446","en":"principle addressed by category","fr":"principe couvert par la catégorie","den":"Relates an OSFI B-13 principle to a NIST CSF 2.0 category that addresses it.","dfr":"Relie un principe de la ligne directrice B-13 du BSIF à une catégorie du NIST CSF 2.0 qui le couvre.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000447","en":"comparable obligation","fr":"obligation comparable","den":"Relates an obligation in one legal regime to a comparable obligation in another regime; comparable is not equivalent, and the annotation states the differences.","dfr":"Relie une obligation d'un régime juridique à une obligation comparable d'un autre régime; comparable ne veut pas dire équivalente, et l'annotation précise les différences.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000448","en":"same obligation in another regime","fr":"même obligation dans un autre régime","den":"Relates an obligation of the Québec private-sector Act to the obligation worded the same way for public bodies.","dfr":"Relie une obligation de la loi sur le secteur privé à l'obligation formulée de la même façon pour les organismes publics.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#closeMatch"]},{"id":"CRGO_0000698","en":"has knowledge status","fr":"a pour statut épistémique","den":"Gives the epistemic category of a record or assertion, such as risk estimate or audit conclusion.","dfr":"Indique la catégorie épistémique d'un enregistrement ou d'une assertion, comme estimation de risque ou conclusion d'audit.","mod":"evidence","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000556"],"sup":[]},{"id":"CRGO_0000699","en":"has access status","fr":"a pour statut d'accès","den":"Gives whether CRGO holds and may use the source a source record describes.","dfr":"Indique si CRGO détient et peut utiliser la source décrite par une notice de source.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000337"],"rng":["https://w3id.org/crgo/CRGO_0000565"],"sup":[]},{"id":"CRGO_0000700","en":"has evidence quality","fr":"a pour qualité des preuves","den":"Gives how strongly the evidence behind an estimate or conclusion supports it.","dfr":"Indique le degré auquel les preuves qui sous-tendent une estimation ou une conclusion l'appuient.","mod":"evidence","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000571"],"sup":[]},{"id":"CRGO_0000701","en":"has distribution","fr":"a pour distribution","den":"Relates an estimate to the distribution that expresses its uncertainty.","dfr":"Relie une estimation à la distribution qui exprime son incertitude.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000037"],"rng":["https://w3id.org/crgo/CRGO_0000476"],"sup":[]},{"id":"CRGO_0000702","en":"has distribution family","fr":"a pour famille de lois","den":"Gives the family of an estimate distribution.","dfr":"Indique la famille d'une distribution d'estimation.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000476"],"rng":["https://w3id.org/crgo/CRGO_0000577"],"sup":[]},{"id":"CRGO_0000703","en":"hypothesis about","fr":"hypothèse portant sur","den":"Relates an analytical hypothesis to what it seeks to explain, such as a finding or an incident.","dfr":"Relie une hypothèse explicative à ce qu'elle cherche à expliquer, comme une constatation ou un incident.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000475"],"rng":[],"sup":["https://www.commoncoreontologies.org/ont00001808"]},{"id":"CRGO_0000704","en":"result for","fr":"résultat pour","den":"Relates an analytical result to what it is computed for, such as a risk scenario or an assessment.","dfr":"Relie un résultat analytique à ce pour quoi il est calculé, comme un scénario de risque ou une appréciation.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000477"],"rng":[],"sup":["https://www.commoncoreontologies.org/ont00001808"]},{"id":"CRGO_0000705","en":"computed from input","fr":"calculé à partir de","den":"Relates an analytical result to an estimate or record it used as input.","dfr":"Relie un résultat analytique à une estimation ou à un enregistrement utilisé comme donnée d'entrée.","mod":"evidence","dom":["https://w3id.org/crgo/CRGO_0000477"],"rng":[],"sup":[]},{"id":"CRGO_0000706","en":"accountable for","fr":"responsable de","den":"Relates an agent, or a group of agents such as a committee, to something it answers for, such as a risk, a control measure, a policy or a corrective action.","dfr":"Relie un agent à ce dont il doit répondre, comme un risque, une mesure appliquée, une politique ou une action corrective.","mod":"governance","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000707","en":"oversees","fr":"exerce une surveillance sur","den":"Relates a governing body, committee or agent to an activity, function or risk it oversees.","dfr":"Relie un organe de gouvernance, un comité ou un agent à une activité, une fonction ou un risque qu'il surveille.","mod":"governance","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000708","en":"reports to","fr":"relève de","den":"Relates an agent or body to the agent or body it reports to.","dfr":"Relie un agent ou un organe à l'agent ou à l'organe dont il relève.","mod":"governance","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000709","en":"delegates authority to","fr":"délègue des pouvoirs à","den":"Relates an agent or governing body to another agent to which it delegates authority; the scope and limits are given by a delegation of authority.","dfr":"Relie un agent à un autre agent auquel il délègue des pouvoirs; la portée et les limites sont données par une délégation de pouvoirs.","mod":"governance","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000710","en":"delegation from","fr":"délégation de la part de","den":"Relates a delegation of authority to the agent that grants it.","dfr":"Relie une délégation de pouvoirs à l'agent qui l'accorde.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000494"],"rng":[],"sup":[]},{"id":"CRGO_0000711","en":"delegation to","fr":"délégation au profit de","den":"Relates a delegation of authority to the agent that receives it.","dfr":"Relie une délégation de pouvoirs à l'agent qui la reçoit.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000494"],"rng":[],"sup":[]},{"id":"CRGO_0000712","en":"operates control","fr":"exploite la mesure","den":"Relates an agent to a control measure it performs or runs.","dfr":"Relie un agent à une mesure appliquée qu'il exécute ou exploite.","mod":"governance","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0000713","en":"requires independence from","fr":"exige l'indépendance à l'égard de","den":"Relates a governance role to another role, function or activity from which its bearer must be independent.","dfr":"Relie un rôle de gouvernance à un autre rôle, une fonction ou une activité à l'égard duquel son porteur doit être indépendant.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000482"],"rng":[],"sup":[]},{"id":"CRGO_0000714","en":"assignment of role","fr":"attribution du rôle","den":"Relates a role assignment to the governance role assigned.","dfr":"Relie une attribution de rôle au rôle de gouvernance attribué.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000493"],"rng":["https://w3id.org/crgo/CRGO_0000482"],"sup":[]},{"id":"CRGO_0000715","en":"assigned to","fr":"attribué à","den":"Relates a role assignment to the agent that bears the role.","dfr":"Relie une attribution de rôle à l'agent qui assume le rôle.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000493"],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000716","en":"role within","fr":"rôle au sein de","den":"Relates a governance role or role assignment to the organisation or body in which it is held.","dfr":"Relie un rôle de gouvernance ou une attribution de rôle à l'organisation ou à l'organe au sein duquel il est exercé.","mod":"governance","dom":[],"rng":["https://www.commoncoreontologies.org/ont00000300"],"sup":[]},{"id":"CRGO_0000717","en":"oversight by","fr":"surveillance par","den":"Relates an oversight activity to the body or agent that performs it.","dfr":"Relie une activité de surveillance à l'organe ou à l'agent qui l'exerce.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000495"],"rng":[],"sup":[]},{"id":"CRGO_0000718","en":"oversight of","fr":"surveillance de","den":"Relates an oversight activity to what it reviews, such as an audit report or a risk.","dfr":"Relie une activité de surveillance à ce qu'elle examine, comme un rapport d'audit ou un risque.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000495"],"rng":[],"sup":[]},{"id":"CRGO_0000719","en":"independence of","fr":"indépendance de","den":"Relates an independence assessment to the agent whose independence is assessed.","dfr":"Relie une évaluation de l'indépendance à l'agent dont l'indépendance est évaluée.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000496"],"rng":["https://www.commoncoreontologies.org/ont00001017"],"sup":[]},{"id":"CRGO_0000720","en":"independence with respect to","fr":"indépendance à l'égard de","den":"Relates an independence assessment to the activity, control or unit with respect to which independence is assessed.","dfr":"Relie une évaluation de l'indépendance à l'activité, la mesure ou l'unité à l'égard de laquelle l'indépendance est évaluée.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000496"],"rng":[],"sup":[]},{"id":"CRGO_0000721","en":"has independence conclusion","fr":"a pour conclusion sur l'indépendance","den":"Gives the conclusion of an independence assessment.","dfr":"Indique la conclusion d'une évaluation de l'indépendance.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000496"],"rng":["https://w3id.org/crgo/CRGO_0000592"],"sup":[]},{"id":"CRGO_0000722","en":"statement of policy","fr":"énoncé de la politique","den":"Relates a policy statemen ":"Relie une dérogation à un actif, un processus, un rôle ou une unité organisationnelle qu'elle vise.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000502"],"rng":[],"sup":[]},{"id":"CRGO_0000728","en":"approving authority","fr":"autorité d'approbation","den":"Relates a policy exception, policy or risk acceptance record to the agent with authority to approve it.","dfr":"Relie une dérogation, une politique ou une acceptation du risque à l'agent ayant le pouvoir de l'approuver.","mod":"governance","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0000729","en":"compensated by","fr":"compensée par","den":"Relates a policy exception to a compensating control that reduces the risk it leaves.","dfr":"Relie une dérogation à une mesure compensatoire qui réduit le risque qu'elle laisse subsister.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000502"],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0000730","en":"decision on","fr":"décision sur","den":"Relates a decision record to what was decided, such as a policy, an exception, a risk acceptance or a finding closure.","dfr":"Relie un relevé de décision à l'objet de la décision, comme une politique, une dérogation, une acceptation du risque ou la clôture d'une constatation.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000504"],"rng":[],"sup":["https://www.commoncoreontologies.org/ont00001808"]},{"id":"CRGO_0000731","en":"decision made by","fr":"décision prise par","den":"Relates a decision record to the agent or body that made the decision.","dfr":"Relie un relevé de décision à l'agent ou à l'organe qui a pris la décision.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000504"],"rng":[],"sup":[]},{"id":"CRGO_0000732","en":"has decision outcome","fr":"a pour résultat de décision","den":"Gives the outcome recorded by a decision record.","dfr":"Indique le résultat consigné par un relevé de décision.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000504"],"rng":["https:/ fier","den":"Relates a lesson learned to a control, procedure, scenario or estimate it says should change.","dfr":"Relie une leçon apprise à une mesure, une procédure, un scénario ou une estimation qu'elle recommande de modifier.","mod":"incident","dom":["https://w3id.org/crgo/CRGO_0000555"],"rng":[],"sup":[]},{"id":"CRGO_0000824","en":"incident informs scenario","fr":"incident éclairant le scénario","den":"Relates an incident to a risk scenario it is evidence about. An incident supports a scenario's likelihood estimate; it does not prove it, and its absence does not disprove it.","dfr":"Relie un incident à un scénario de risque dont il constitue une preuve. Un incident appuie l'estimation de vraisemblance d'un scénario sans la prouver, et son absence ne l'infirme pas.","mod":"incident","dom":["https://w3id.org/crgo/CRGO_0000015"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0000825","en":"narrower than","fr":"plus étroit que","den":"Relates a concept of one vocabulary to a concept of another whose meaning includes it; every case of the subject is a case of the object.","dfr":"Relie un concept d'un vocabulaire à un concept d'un autre vocabulaire dont le sens l'englobe; tout cas du sujet est un cas de l'objet.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#broadMatch"]},{"id":"CRGO_0000826","en":"broader than","fr":"plus large que","den":"Relates a concept of one vocabulary to a concept of another whose meaning it includes.","dfr":"Relie un concept d'un vocabulaire à un concept d'un autre vocabulaire dont il englobe le sens.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#narrowMatch"]},{"id":"CRGO_0000827","en":"partially overlaps","fr":"recoupe partiellement","den":"Relates two concepts of different vocabularies that share part of their meaning, neither including the other; the annotation states what is shared.","dfr":"Relie deux concepts de vocabulaires différents qui partagent une partie de leur sens sans que l'un englobe l'autre; l'annotation précise ce qui est partagé.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000828","en":"supports compliance with","fr":"contribue à la conformité à","den":"Relates a control or framework requirement to a provision or obligation that implementing it can help meet. It never proves compliance: that needs a compliance determination with evidence.","dfr":"Relie une mesure ou une exigence de référentiel à une disposition ou à une obligation que sa mise en œuvre peut aider à respecter. Elle ne prouve jamais la conformité, qui exige un constat de conformité appuyé de preuves.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000829","en":"fulfils criterion","fr":"satisfait au critère","den":"Relates a control to an assurance criterion, such as a Trust Services criterion, that it is designed to meet.","dfr":"Relie une mesure à un critère d'assurance, comme un critère des services de confiance, qu'elle est conçue pour satisfaire.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000830","en":"evaluates control","fr":"évalue le contrôle","den":"Relates an assessment objective, such as an SP 800-53A objective, to the control or control enhancement whose implementation it assesses.","dfr":"Relie un objectif d'évaluation, comme un objectif SP 800-53A, au contrôle ou à l'amélioration de contrôle dont il évalue la mise en œuvre.","mod":"mapping","dom":[],"rng":[],"sup":["http://www.w3.org/2004/02/skos/core#relatedMatch"]},{"id":"CRGO_0000882","en":"role for","fr":"rôle à l'égard de","den":"Relates a governance role to the control measure, risk scenario, process or function it concerns, such as the backup control for a control owner role.","dfr":"Relie un rôle de gouvernance à la mesure appliquée, au scénario de risque, au processus ou à la fonction qu'il concerne, comme la mesure de sauvegarde pour un rôle de propriétaire de mesure.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000482"],"rng":[],"sup":[]},{"id":"CRGO_0000883","en":"informed by","fr":"éclairée par","den":"Relates a decision record to an analytical result, assessment, finding or evidence item the decision took into account.","dfr":"Relie un relevé de décision à un résultat analytique, une évaluation, une constatation ou un élément de preuve dont la décision a tenu compte.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000504"],"rng":[],"sup":[]},{"id":"CRGO_0000884","en":"committee of","fr":"comité de","den":"Relates a governance committee to the governing body that set it up and to which it reports.","dfr":"Relie un comité de gouvernance à l'organe de gouvernance qui l'a constitué et dont il relève.","mod":"governance","dom":["https://w3id.org/crgo/CRGO_0000479"],"rng":["https://w3id.org/crgo/CRGO_0000478"],"sup":[]},{"id":"CRGO_0001006","en":"version of directive","fr":"version de la directive","den":"Relates a directive version to the policy, technical standard, procedure, guideline, charter or methodology it is a version of.","dfr":"Relie une version de directive à la politique, la norme technique, la procédure, la ligne directrice, la charte ou la méthodologie dont elle est une version.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000886"],"rng":[],"sup":[]},{"id":"CRGO_0001007","en":"statement in version","fr":"énoncé de la version","den":"Relates a policy statement to the directive version it is part of.","dfr":"Relie un énoncé de politique à la version de directive dont il fait partie.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000886"],"sup":[]},{"id":"CRGO_0001008","en":"clause of","fr":"article de","den":"Relates a policy clause to the directive version it is part of.","dfr":"Relie un article de politique à la version de directive dont il fait partie.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000888"],"rng":["https://w3id.org/crgo/CRGO_0000886"],"sup":[]},{"id":"CRGO_0001009","en":"in clause","fr":"dans l'article","den":"Relates a policy statement to the clause where it appears.","dfr":"Relie un énoncé de politique à l'article où il figure.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000888"],"sup":[]},{"id":"CRGO_0001010","en":"in policy family","fr":"dans la famille de politiques","den":"Relates a directive to a policy family it belongs to.","dfr":"Relie une directive à une famille de politiques dont elle fait partie.","mod":"policy","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000885"],"sup":[]},{"id":"CRGO_0001011","en":"has normative modality","fr":"a pour modalité normative","den":"Gives how binding a policy statement is.","dfr":"Indique le degré de contrainte d'un énoncé de politique.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000913"],"sup":[]},{"id":"CRGO_0001012","en":"has lifecycle state","fr":"a pour état de cycle de vie","den":"Gives the lifecycle state of a directive version, as last recorded.","dfr":"Indique l'état du cycle de vie d'une version de directive, selon le dernier enregistrement.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000886"],"rng":["https://w3id.org/crgo/CRGO_0000919"],"sup":[]},{"id":"CRGO_0001013","en":"statement implemented by","fr":"énoncé appliqué par","den":"Relates a policy statement to a control measure the organisation relies on to meet it. Implementation is not evidence that the measure is effective.","dfr":"Relie un énoncé de politique à une mesure appliquée sur laquelle l'organisation s'appuie pour le respecter. L'application ne prouve pas que la mesure est efficace.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000020"],"sup":[]},{"id":"CRGO_0001014","en":"intended to mitigate","fr":"vise à atténuer","den":"Relates a policy statement to a risk scenario it is meant to reduce. States intent only; it does not say that the risk is reduced.","dfr":"Relie un énoncé de politique à un scénario de risque qu'il vise à réduire. N'indique que l'intention; il n'affirme pas que le risque est réduit.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000023"],"sup":[]},{"id":"CRGO_0001015","en":"applies to scope","fr":"s'applique au périmètre","den":"Relates a policy statement, guideline or directive to an asset, process, role, organisational unit or jurisdiction it explicitly applies to.","dfr":"Relie un énoncé de politique, une ligne directrice ou une directive à un actif, un processus, un rôle, une unité organisationnelle ou une juridiction auquel il s'applique explicitement.","mod":"policy","dom":[],"rng":[],"sup":[]},{"id":"CRGO_0001016","en":"requires training","fr":"exige la formation","den":"Relates a policy statement to a training requirement for those it applies to.","dfr":"Relie un énoncé de politique à une exigence de formation pour les personnes visées.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000498"],"rng":["https://w3id.org/crgo/CRGO_0000893"],"sup":[]},{"id":"CRGO_0001017","en":"authorised by risk acceptance","fr":"autorisée par l'acceptation du risque","den":"Relates a policy exception to the risk acceptance decision that accepts the risk it leaves. A policy exception does not imply a risk acceptance; the link is stated when one was made.","dfr":"Relie une dérogation à la décision d'acceptation du risque qui accepte le risque qu'elle laisse subsister. Une dérogation n'implique pas une acceptation du risque; le lien est indiqué lorsqu'il y en a une.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000502"],"rng":["https://w3id.org/crgo/CRGO_0000031"],"sup":[]},{"id":"CRGO_0001018","en":"review of","fr":"revue de","den":"Relates a directive review to the directive, directive version or policy statement reviewed.","dfr":"Relie une revue de directive à la directive, la version de directive ou l'énoncé de politique revu.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000890"],"rng":[],"sup":[]},{"id":"CRGO_0001019","en":"has review trigger","fr":"a pour déclencheur de revue","den":"Gives what caused a directive review.","dfr":"Indique ce qui a provoqué une revue de directive.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000890"],"rng":["https://w3id.org/crgo/CRGO_0000927"],"sup":[]},{"id":"CRGO_0001020","en":"review triggered by","fr":"revue déclenchée par","den":"Relates a directive review to the regulatory change, incident, finding or other record that caused it.","dfr":"Relie une revue de directive au changement réglementaire, à l'incident, à la constatation ou à tout autre enregistrement qui l'a provoquée.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000890"],"rng":[],"sup":[]},{"id":"CRGO_0001021","en":"attested by","fr":"attestée par","den":"Relates an attestation to the agent who made it.","dfr":"Relie une attestation à l'agent qui l'a faite.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000891"],"rng":[],"sup":[]},{"id":"CRGO_0001022","en":"attestation about","fr":"attestation portant sur","den":"Relates an attestation to what it declares about, such as an exact policy version or a set of obligations.","dfr":"Relie une attestation à ce sur quoi porte la déclaration, comme une version précise de politique ou un ensemble d'obligations.","mod":"policy","dom":["https://w3id.org/crgo/CRGO_0000891"],"rng":[],"sup":[]},{"id":"CRGO_0001023","en":"programme covers","fr":"programme visant","den":"Relates a compliance programme to an obligation, legal instrument, framework adoption or commitment within its scope.","dfr":"Relie un programme de conformité à une obligation, un instrument juridique, une adoption de référentiel ou un engagement compris dans son périmètre.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000894"],"rng":[],"sup":[]},{"id":"CRGO_0001024","en":"objective of programme","fr":"objectif du programme","den":"Relates a compliance objective to the compliance programme that sets it.","dfr":"Relie un objectif de conformité au programme de conformité qui le fixe.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000895"],"rng":["https://w3id.org/crgo/CRGO_0000894"],"sup":[]},{"id":"CRGO_0001025","en":"interpretation of","fr":"interprétation de","den":"Relates a requirement interpretation to the obligation, provision or requirement it interprets.","dfr":"Relie une interprétation d'exigence à l'obligation, la disposition ou l'exigence qu'elle interprète.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000896"],"rng":[],"sup":[]},{"id":"CRGO_0001026","en":"has legal review state","fr":"a pour état de revue juridique","den":"Gives how far a requirement interpretation has been reviewed by counsel.","dfr":"Indique le degré de revue d'une interprétation d'exigence par un conseiller juridique.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000896"],"rng":["https://w3id.org/crgo/CRGO_0000936"],"sup":[]},{"id":"CRGO_0001027","en":"issued by authority","fr":"émis par l'autorité","den":"Relates a legal instrument, guidance or exemption to the regulatory authority that issued it.","dfr":"Relie un instrument juridique, une orientation ou une dispense à l'autorité de réglementation qui l'a émis.","mod":"compliance","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000897"],"sup":[]},{"id":"CRGO_0001028","en":"enforced by","fr":"dont l'application relève de","den":"Relates a legal instrument or provision to a regulatory authority that supervises or enforces it.","dfr":"Relie un instrument juridique ou une disposition à une autorité de réglementation qui en surveille ou en assure l'application.","mod":"compliance","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000897"],"sup":[]},{"id":"CRGO_0001029","en":"adopts framework","fr":"adopte le référentiel","den":"Relates a framework adoption to the framework, or the part of a framework, adopted.","dfr":"Relie une adoption de référentiel au référentiel, ou à la partie de référentiel, adopté.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000898"],"rng":[],"sup":[]},{"id":"CRGO_0001030","en":"determination in","fr":"constat effectué dans","den":"Relates a compliance determination to the compliance assessment campaign that produced it.","dfr":"Relie un constat de conformité à la campagne d'évaluation de la conformité qui l'a produit.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000346"],"rng":["https://w3id.org/crgo/CRGO_0000899"],"sup":[]},{"id":"CRGO_0001031","en":"provision version of","fr":"version de la disposition","den":"Relates a provision version to the provision whose wording it records.","dfr":"Relie une version de disposition à la disposition dont elle consigne le libellé.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000900"],"rng":[],"sup":[]},{"id":"CRGO_0001032","en":"in instrument version","fr":"dans la version de l'instrument","den":"Relates a provision version to the instrument version that carries that wording.","dfr":"Relie une version de disposition à la version de l'instrument qui porte ce libellé.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000900"],"rng":["https://w3id.org/crgo/CRGO_0000507"],"sup":[]},{"id":"CRGO_0001033","en":"evaluates provision version","fr":"évalue la version de la disposition","den":"Relates a compliance or applicability determination to the exact provision version it evaluated, when the wording has changed over time.","dfr":"Relie un constat de conformité ou d'applicabilité à la version précise de la disposition évaluée, lorsque le libellé a changé au fil du temps.","mod":"compliance","dom":[],"rng":["https://w3id.org/crgo/CRGO_0000900"],"sup":[]},{"id":"CRGO_0001034","en":"deadline for","fr":"échéance de","den":"Relates a compliance deadline to the obligation or provision that sets it.","dfr":"Relie une échéance de conformité à l'obligation ou à la disposition qui la fixe.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000901"],"rng":[],"sup":[]},{"id":"CRGO_0001035","en":"has deadline trigger kind","fr":"a pour type de déclenchement","den":"Gives whether a compliance deadline is a calendar date or counted from an event.","dfr":"Indique si une échéance de conformité est une date calendaire ou un délai compté à partir d'un événement.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000901"],"rng":["https://w3id.org/crgo/CRGO_0000947"],"sup":[]},{"id":"CRGO_0001036","en":"deadline triggered by","fr":"échéance déclenchée par","den":"Relates an event-triggered compliance deadline to the record of the triggering event, such as an incident confirmation.","dfr":"Relie une échéance déclenchée par un événement à l'enregistrement de cet événement, comme une confirmation d'incident.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000901"],"rng":[],"sup":[]},{"id":"CRGO_0001037","en":"submission to","fr":"transmise à","den":"Relates a regulatory submission to the authority it was sent to.","dfr":"Relie une transmission réglementaire à l'autorité à laquelle elle a été envoyée.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000902"],"rng":["https://w3id.org/crgo/CRGO_0000897"],"sup":[]},{"id":"CRGO_0001038","en":"submission under","fr":"transmise en vertu de","den":"Relates a regulatory submission to the obligation or provision it is made under.","dfr":"Relie une transmission réglementaire à l'obligation ou à la disposition en vertu de laquelle elle est faite.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000902"],"rng":[],"sup":[]},{"id":"CRGO_0001040","en":"has submission state","fr":"a pour état de transmission","den":"Gives the state of a regulatory submission, as last recorded.","dfr":"Indique l'état d'une transmission réglementaire, selon le dernier enregistrement.","mod":"compliance","dom":["https://w3id.org/crgo/CRGO_0000902"]," ":"charte de","den":"Relates an audit charter to the audit function it governs.","dfr":"Relie une charte d'audit à la fonction d'audit qu'elle régit.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000906"],"rng":["https://w3id.org/crgo/CRGO_0000905"],"sup":[]},{"id":"CRGO_0001047","en":"entry in plan","fr":"entrée du plan","den":"Relates an audit plan entry to the audit plan it belongs to.","dfr":"Relie une entrée du plan d'audit au plan d'audit dont elle fait partie.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000908"],"rng":["https://w3id.org/crgo/CRGO_0000533"],"sup":[]},{"id":"CRGO_0001048","en":"entry for engagement","fr":"entrée pour la mission","den":"Relates an audit plan entry to the engagement it plans.","dfr":"Relie une entrée du plan d'audit à la mission qu'elle prévoit.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000908"],"rng":["https://w3id.org/crgo/CRGO_0000536"],"sup":[]},{"id":"CRGO_0001049","en":"entry for auditable entity","fr":"entrée pour l'entité auditable","den":"Relates an audit plan entry to an auditable entity it covers.","dfr":"Relie une entrée du plan d'audit à une entité auditable qu'elle vise.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000908"],"rng":["https://w3id.org/crgo/CRGO_0000532"],"sup":[]},{"id":"CRGO_0001050","en":"has plan entry state","fr":"a pour état d'entrée","den":"Gives the state of an audit plan entry.","dfr":"Indique l'état d'une entrée du plan d'audit.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000908"],"rng":["https://w3id.org/crgo/CRGO_0000973"],"sup":[]},{"id":"CRGO_0001051","en":"entry informed by","fr":"entrée éclairée par","den":"Relates an audit plan entry to a risk assessment or risk scenario that informed its priority.","dfr":"Relie une entrée du plan d'audit à une appréciation du risque ou à un scénario de risque qui en a éclairé la priorité.","mod":"audit","dom":["https://w3id.org/crgo/CRGO_0000908"],"rng":[],"sup":[]},{"id":"CRGO_0001052","en":"has engagement type","fr": function hub(){const t=T[L],G=HUBS[hubKey];const svg=document.getElementById("hub");const pos={};G.nodes.forEach(([id,x,y])=>pos[id]=[x,y]);

 let s=`<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
 G.bands.forEach(([en,fr,x,y,a])=>s+=`<text class="band" x="${x}" y="${y}" text-anchor="${a}">${L==="fr"?fr:en}</text>`);
 const clip=(x1,y1,x2,y2,w,h)=>{const dx=x2-x1,dy=y2-y1;const sx=(w/2+4)/Math.abs(dx||1e-6),sy=(h/2+4)/Math.abs(dy||1e-6);const k=Math.min(sx,sy,1);return[x2-dx*k,y2-dy*k]};
