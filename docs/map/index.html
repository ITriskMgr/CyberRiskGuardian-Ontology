<body>

<style>
/* Layout: header strip, two relation diagrams (risk scenario; control measure across governance and operations), data-layer chips, then all classes in BFO columns with a sticky detail panel. Colour = module family. */
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6672; --line:#d6dbd8; --soft:#eceeeb;
  --core:#1f7a72; --evid:#b07a14; --grc:#6a5fa8; --assur:#2f6aa3; --ops:#b0473a; --vocab:#66707a;
  --core-t:#e3f1ef; --evid-t:#f6eedb; --grc-t:#ecebf6; --assur-t:#e3ecf6; --ops-t:#f5e5e2; --vocab-t:#eceef0;
  --display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --ink:#e6eaee; --muted:#9aa6b2; --line:#2e3843; --soft:#222a33;
  --core:#5cc2b6; --evid:#e0b04f; --grc:#a69ce0; --assur:#7fb0e6; --ops:#e57f70; --vocab:#a3adb8;
  --core-t:#16302d; --evid-t:#33290f; --grc-t:#26233b; --assur-t:#182a3d; --ops-t:#3a201c; --vocab-t:#232a32; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --ink:#e6eaee; --muted:#9aa6b2; --line:#2e3843; --soft:#222a33;
  --core:#5cc2b6; --evid:#e0b04f; --grc:#a69ce0; --assur:#7fb0e6; --ops:#e57f70; --vocab:#a3adb8;
  --core-t:#16302d; --evid-t:#33290f; --grc-t:#26233b; --assur-t:#182a3d; --ops-t:#3a201c; --vocab-t:#232a32; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:28px 60px}
header{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-family:var(--display);font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font-family:var(--mono);font-size:.78rem;font-weight:400;color:var(--muted);letter-spacing:.02em;margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem}
.facts b{color:var(--ink);font-family:var(--display);font-size:1.15rem;font-weight:600;margin-right:4px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:500 .82rem var(--body);background:var(--surface);color:var(--muted);border:0;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font:500 .8rem var(--body);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="false"]{opacity:.45}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
input[type=search]{font:400 .9rem var(--body);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-width:0;width:220px;max-width:100%}
button:focus-visible,input:focus-visible,.cls:focus-visible,.node:focus-visible{outline:2px solid var(--core);outline-offset:2px}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:34px 0 4px}
.lede{color:var(--muted);margin:0 0 12px;max-width:72ch}
.hub{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.hub svg{display:block;min-width:820px;width:100%;height:auto}
.hub text{font-family:var(--body);fill:var(--ink)}
.hub .band{font:600 11px var(--mono);letter-spacing:.08em;fill:var(--muted)}
.hub .elab{font:500 10.5px var(--mono);fill:var(--muted)}
.hub .edge{stroke:var(--line);stroke-width:1.6;fill:none}
.hub .edge.hot{stroke:var(--ink);stroke-width:2}
.hub .node{cursor:pointer}
.hub .node rect{stroke-width:1.5}
.hub .node:hover rect,.hub .node.sel rect{stroke-width:3}
.hub .nl{font:600 13px var(--body)}
.hub .nm{font:500 9.5px var(--mono);letter-spacing:.06em}
.layer{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.vchip{font:500 .78rem var(--mono);background:var(--vocab-t);color:var(--ink);border:1px dashed var(--vocab);border-radius:6px;padding:4px 9px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;margin-top:10px}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-items:start}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 12px 14px;min-width:0}
.col.wide{grid-column:1/-1}
.col.wide .tree{columns:3 230px;column-gap:18px}
.col h3{font:600 .72rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 2px}
.col .bfo{font-size:.78rem;color:var(--muted);margin:0 0 8px}
.grp{break-inside:avoid;margin:0 0 10px}
.grp>.gh{font:500 .72rem var(--mono);color:var(--muted);margin:6px 0 3px;border-top:1px dashed var(--line);padding-top:5px}
.cls{display:flex;align-items:center;gap:7px;width:100%;text-align:left;font:500 .86rem var(--body);color:var(--ink);background:none;border:0;border-left:3px solid transparent;padding:3px 6px;border-radius:0 5px 5px 0;cursor:pointer}
.cls:hover{background:var(--soft)}
.cls.sel{background:var(--soft);border-left-color:var(--ink)}
.cls .n{font:400 .7rem var(--mono);color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.cls.dim{opacity:.25}
.kids{margin-left:12px;border-left:1px solid var(--line);padding-left:4px}
.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;max-height:calc(100vh - 24px);overflow:auto;min-width:0}
.panel .tag{display:inline-block;font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:2px 7px}
.panel h4{font-family:var(--display);font-size:1.35rem;margin:8px 0 2px;line-height:1.15}
.panel .alt{color:var(--muted);font-size:.88rem;margin:0}
.panel .iri{font:400 .74rem var(--mono);color:var(--muted);word-break:break-all;margin:6px 0 10px}
.panel p.def{margin:0 0 12px}
.panel h5{font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.panel li{font-size:.86rem;line-height:1.35}
.panel .rel{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.panel .lnk{font:inherit;color:var(--ink);background:none;border:0;padding:0;border-bottom:1px solid var(--line);cursor:pointer}
.panel .lnk:hover{border-bottom-color:var(--ink)}
.panel .inh{font:400 .68rem var(--mono);color:var(--muted)}
.chain{font-size:.82rem;color:var(--muted)}
.vals{display:flex;flex-wrap:wrap;gap:5px}
.vals span{font-size:.78rem;background:var(--soft);border-radius:4px;padding:2px 7px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}
footer{margin-top:36px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:14px}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){.cls,.hub .edge{transition:opacity .15s,stroke .15s}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.tabs button{font:500 .84rem var(--body);background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.layer .vg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.layer .vgh{font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:11rem}
.panel .iri a{color:inherit}
.new{font:600 .62rem var(--mono);letter-spacing:.06em;color:var(--muted);border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:4px}
</style>

<script>
const D={"classes":[{"id":"CRGO_0000001","en":"asset","fr":"actif","den":"An information, software, hardware, network, service or facility entity of a kind used to process, store, transmit or protect information or to deliver services; whether and how much a given organisation values it is recorded in an asset valuation.","dfr":"Entité informationnelle, logicielle, matérielle, réseau, de service ou d'installation d'un type utilisé pour traiter, stocker, transmettre ou protéger de l'information ou pour fournir des services; la valeur qu'une organisation donnée lui accorde est consignée dans une évaluation d'actif.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000001"],"bucket":"none","values":[]},{"id":"CRGO_0000002","en":"information asset","fr":"actif informationnel","den":"An asset that is information content, such as a data set, a record collection or a document, independent of the medium that carries it.","dfr":"Actif constitué de contenu informationnel, comme un jeu de données, un ensemble de dossiers ou un document, indépendamment du support qui le porte.","mod":"core","parents":["CRGO_0000001","https://www.commoncoreontologies.org/ont00000958"],"bucket":"ice","values":[]},{"id":"CRGO_0000003","en":"software asset","fr":"actif logiciel","den":"An asset that is a computer program or application, including its configuration, considered independently of the hardware that runs it.","dfr":"Actif constitué d'un programme ou d'une application informatique, y compris sa configuration, considéré indépendamment du matériel qui l'exécute.","mod":"core","parents":["CRGO_0000001","https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000004","en":"hardware asset","fr":"actif matériel","den":"An asset that is a material artifact used to process, store or transmit information, such as a server, workstation, network device or connected equipment.","dfr":"Actif constitué d'un artefact matériel servant à traiter, stocker ou transmettre de l'information, comme un serveur, un poste de travail, un équipement réseau ou un appareil connecté.","mod":"core","parents":["CRGO_0000001","https://www.commoncoreontologies.org/ont00000995"],"bucket":"material","values":[]},{"id":"CRGO_0000005","en":"connected device","fr":"appareil connecté","den":"A hardware asset with embedded computing and network connectivity whose malfunction can affect physical processes, such as an IoT, OT or medical device.","dfr":"Actif matériel doté de capacités de calcul et de connectivité réseau intégrées dont le dysfonctionnement peut toucher des processus physiques, comme un objet connecté, un équipement de technologie opérationnelle ou un dispositif médical.","mod":"core","parents":["CRGO_0000004"],"bucket":"material","values":[]},{"id":"CRGO_0000006","en":"network asset","fr":"actif réseau","den":"A hardware asset, or an interconnected set of them, that carries communications between other assets, such as a local network, a WiFi network or an inter-establishment link.","dfr":"Actif matériel, ou ensemble interconnecté de tels actifs, qui achemine les communications entre d'autres actifs, comme un réseau local, un réseau sans fil ou un lien inter-établissement.","mod":"core","parents":["CRGO_0000004"],"bucket":"material","values":[]},{"id":"CRGO_0000007","en":"service asset","fr":"actif de service","den":"An asset that is a provider's capability to deliver a service to the organisation, internally or as a third party, such as a cloud application, hosting, telecommunications or a managed security service; the capability inheres in the provider's systems or organisation.","dfr":"Actif constitué de la capacité d'un fournisseur à offrir un service à l'organisation, à l'interne ou à titre de tiers, comme une application infonuagique, un hébergement, des télécommunications ou un service de sécurité géré; cette capacité réside dans les systèmes ou l'organisation du fournisseur.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000017","CRGO_0000001"],"bucket":"realizable","values":[]},{"id":"CRGO_0000008","en":"facility asset","fr":"actif d'installation","den":"An asset that is a building, room or site housing other assets or activities, such as a server room, data centre, archive or clinic.","dfr":"Actif constitué d'un bâtiment, d'une salle ou d'un site qui abrite d'autres actifs ou activités, comme une salle des serveurs, un centre de données, des archives ou une clinique.","mod":"core","parents":["CRGO_0000001","https://www.commoncoreontologies.org/ont00000192"],"bucket":"material","values":[]},{"id":"CRGO_0000009","en":"business process","fr":"processus d'affaires","den":"A process, consisting of recurring organisational activities, that delivers part of the organisation's mission and depends on assets.","dfr":"Processus, constitué d'activités organisationnelles récurrentes, qui réalise une partie de la mission de l'organisation et qui dépend d'actifs.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000015"],"bucket":"process","values":[]},{"id":"CRGO_0000010","en":"business objective","fr":"objectif d'affaires","den":"An objective the organisation pursues that business processes support and that cybersecurity risk can threaten.","dfr":"Objectif poursuivi par l'organisation, soutenu par des processus d'affaires et que le risque de cybersécurité peut compromettre.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000476"],"bucket":"ice","values":[]},{"id":"CRGO_0000011","en":"asset valuation","fr":"évaluation d'actif","den":"A description of how much an entity matters to a given organisation, recording its criticality, its confidentiality, integrity and availability requirements, its owner and whether it is a crown jewel.","dfr":"Description de l'importance d'une entité pour une organisation donnée, qui consigne sa criticité, ses exigences de confidentialité, d'intégrité et de disponibilité, son propriétaire et son statut de joyau de la couronne.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000012","en":"threat source role","fr":"rôle de source de menace","den":"A role borne by an agent or artifact in virtue of which it may initiate a threat event, intentionally or not.","dfr":"Rôle porté par un agent ou un artefact en vertu duquel il peut déclencher un événement de menace, intentionnellement ou non.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000023"],"bucket":"role","values":[]},{"id":"CRGO_0000014","en":"threat event description","fr":"description d'événement de menace","den":"A description of a kind of event that, if it occurred, could adversely affect assets, such as credential phishing, ransomware encryption or a server-room fire.","dfr":"Description d'un type d'événement qui, s'il se produisait, pourrait porter atteinte à des actifs, comme l'hameçonnage d'identifiants, le chiffrement par rançongiciel ou l'incendie d'une salle des serveurs.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000015","en":"incident","fr":"incident","den":"An actual occurrence of an adverse event affecting the organisation's assets or information, including a confidentiality incident under Loi 25.","dfr":"Occurrence réelle d'un événement défavorable touchant les actifs ou l'information de l'organisation, y compris un incident de confidentialité au sens de la Loi 25.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000015"],"bucket":"process","values":[]},{"id":"CRGO_0000016","en":"vulnerability","fr":"vulnérabilité","den":"A disposition of a material asset, such as a device, storage medium or network equipment, or of an organisation, that a threat source can exploit to cause harm. Weaknesses of software, information or controls are recorded as vulnerability descriptions.","dfr":"Disposition d'un actif matériel, comme un appareil, un support de stockage ou un équipement réseau, ou d'une organisation, qu'une source de menace peut exploiter pour causer un préjudice. Les faiblesses des logiciels, de l'information ou des contrôles sont consignées comme descriptions de vulnérabilité.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000548"],"bucket":"disposition","values":[]},{"id":"CRGO_0000017","en":"predisposing condition","fr":"condition prédisposante","den":"A condition of the organisation, its environment or its systems that increases or decreases the likelihood that a threat event causes harm, without being a weakness of a specific control.","dfr":"Condition de l'organisation, de son environnement ou de ses systèmes qui augmente ou diminue la probabilité qu'un événement de menace cause un préjudice, sans être une faiblesse d'un contrôle précis.","mod":"core","parents":["http://purl.obolibrary.org/obo/BFO_0000016"],"bucket":"disposition","values":[]},{"id":"CRGO_0000018","en":"control gap finding","fr":"constat de lacune de contrôle","den":"A description stating that an expected control is absent or inadequate in an organisation, such as no penetration testing or no continuity plan.","dfr":"Description qui constate l'absence ou l'insuffisance d'un contrôle attendu dans une organisation, comme l'absence de tests d'intrusion ou de plan de continuité.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000019","en":"control","fr":"mesure de sécurité","den":"A prescription of a measure that modifies risk, such as a policy, procedure, technical safeguard or practice, independent of whether any organisation has implemented it.","dfr":"Prescription d'une mesure qui modifie le risque, comme une politique, une procédure, une protection technique ou une pratique, indépendamment de sa mise en œuvre par une organisation.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000020","en":"control measure","fr":"mesure de sécurité appliquée","den":"A description of a control as it stands in a given organisation, with its status (in place, planned or proposed), scope, owner and the evidence of its effectiveness.","dfr":"Description d'un contrôle tel qu'il se présente dans une organisation donnée, avec son statut (en place, prévu ou proposé), sa portée, son responsable et les preuves de son efficacité.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000021","en":"framework requirement","fr":"exigence de référentiel","den":"A requirement, control objective or outcome stated in a published framework or standard, identified by its official identifier.","dfr":"Exigence, objectif de contrôle ou résultat énoncé dans un référentiel ou une norme publiés, identifié par son identifiant officiel.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000022","en":"legal obligation","fr":"obligation légale","den":"A prescription of a duty imposed by a statute or regulation, identified by its legal citation, such as keeping a register of confidentiality incidents under Loi 25.","dfr":"Prescription d'une obligation imposée par une loi ou un règlement, identifiée par sa référence juridique, comme la tenue d'un registre des incidents de confidentialité en vertu de la Loi 25.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000023","en":"risk scenario","fr":"scénario de risque","den":"A description of a plausible causal chain in which a threat source initiates a threat event that exploits a vulnerability or condition, affects assets or processes and leads to consequences.","dfr":"Description d'une chaîne causale plausible dans laquelle une source de menace déclenche un événement de menace qui exploite une vulnérabilité ou une condition, touche des actifs ou des processus et entraîne des conséquences.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000024","en":"library scenario","fr":"scénario de bibliothèque","den":"A risk scenario written for no particular organisation, or generalised from one, kept in a library to seed candidate scenarios.","dfr":"Scénario de risque rédigé pour aucune organisation en particulier, ou généralisé à partir d'une organisation, conservé dans une bibliothèque pour alimenter des scénarios candidats.","mod":"core","parents":["CRGO_0000023"],"bucket":"ice","values":[]},{"id":"CRGO_0000025","en":"assessment scenario","fr":"scénario d'évaluation","den":"A risk scenario stated for a specific organisation within a risk assessment, whether as a screened candidate or as a selected scenario.","dfr":"Scénario de risque énoncé pour une organisation précise dans le cadre d'une appréciation du risque, qu'il s'agisse d'un candidat présélectionné ou d'un scénario retenu.","mod":"core","parents":["CRGO_0000023"],"bucket":"ice","values":[]},{"id":"CRGO_0000026","en":"scenario step","fr":"étape de scénario","den":"A description of one stage in the event sequence of a risk scenario, with its order and evidence basis.","dfr":"Description d'une étape de la séquence d'événements d'un scénario de risque, avec son rang et le fondement de preuve.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000027","en":"consequence description","fr":"description de conséquence","den":"A description of an outcome that a risk scenario could have for the organisation along one impact dimension.","dfr":"Description d'un résultat qu'un scénario de risque pourrait avoir pour l'organisation selon une dimension d'impact.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000028","en":"risk assessment","fr":"appréciation du risque","den":"A planned act in which an organisation identifies, analyses and evaluates its cybersecurity risk scenarios over a stated period, using a stated method and risk appetite.","dfr":"Acte planifié par lequel une organisation identifie, analyse et évalue ses scénarios de risque de cybersécurité pour une période donnée, selon une méthode et un appétit pour le risque énoncés.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000029","en":"risk appetite statement","fr":"énoncé d'appétit pour le risque","den":"A prescription, approved by management, of how much cybersecurity risk the organisation is willing to accept, expressed in CRG on a 0-1 scale.","dfr":"Prescription, approuvée par la direction, du niveau de risque de cybersécurité que l'organisation est prête à accepter, exprimée dans CRG sur une échelle de 0 à 1.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000030","en":"risk treatment decision","fr":"décision de traitement du risque","den":"A decision prescribing how a risk scenario is treated (modify, retain, avoid or share), by whom and with what authority.","dfr":"Décision qui prescrit le traitement d'un scénario de risque (modifier, conserver, éviter ou partager), par qui et avec quelle autorité.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000031","en":"risk acceptance","fr":"acceptation du risque","den":"A risk treatment decision to retain a residual risk, recording the accepting authority and an expiry date.","dfr":"Décision de traitement du risque visant à conserver un risque résiduel, qui consigne l'autorité qui l'accepte et une date d'expiration.","mod":"core","parents":["CRGO_0000030"],"bucket":"ice","values":[]},{"id":"CRGO_0000032","en":"treatment initiative","fr":"initiative de traitement","den":"A plan to implement one or more control measures that addresses one or more risk scenarios, with owner, priority, costs and schedule.","dfr":"Plan de mise en œuvre d'une ou de plusieurs mesures de contrôle visant un ou plusieurs scénarios de risque, avec responsable, priorité, coûts et calendrier.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000033","en":"cost allocation","fr":"répartition des coûts","den":"A description of the share of a treatment initiative's initial and recurring cost charged to one risk scenario.","dfr":"Description de la part des coûts initiaux et récurrents d'une initiative de traitement imputée à un scénario de risque.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000034","en":"key risk indicator","fr":"indicateur clé de risque","den":"A description of a metric used to monitor one or more risk scenarios, with its measurement method, data source, owner, frequency, target and warning and critical thresholds.","dfr":"Description d'une mesure servant à surveiller un ou plusieurs scénarios de risque, avec sa méthode de mesure, sa source de données, son responsable, sa fréquence, sa cible et ses seuils d'alerte et critique.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000035","en":"budget calibration","fr":"étalonnage du budget","den":"A description that relates the organisation's cybersecurity budget, as a share of its total IT budget, to its risk appetite using the CRG 4 / 7.8 / 12 percent band.","dfr":"Description qui relie le budget de cybersécurité de l'organisation, en proportion de son budget TI total, à son appétit pour le risque selon la bande CRG de 4 / 7,8 / 12 pour cent.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000036","en":"evidence register entry","fr":"entrée du registre de preuves","den":"A description of a piece of evidence used in an assessment, with its locator and its basis (documented, external, expert input, inference or AI estimate).","dfr":"Description d'une preuve utilisée dans une appréciation, avec sa référence et son fondement (documenté, externe, avis d'expert, inférence ou estimation par IA).","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000037","en":"estimate","fr":"estimation","den":"A measurement content entity giving a value for some aspect of a risk scenario or control, with its scale, qualitative reading, rationale, evidence and confidence.","dfr":"Entité de contenu de mesure qui donne une valeur pour un aspect d'un scénario de risque ou d'un contrôle, avec son échelle, sa lecture qualitative, sa justification, ses preuves et son niveau de confiance.","mod":"measure","parents":["https://www.commoncoreontologies.org/ont00001163"],"bucket":"ice","values":[]},{"id":"CRGO_0000038","en":"measurement scale","fr":"échelle de mesure","den":"A description of the range and meaning of the values an estimate may take, such as the unit interval 0-1, the CVSS 0-10 scale or a five-level ordinal scale.","dfr":"Description de l'étendue et de la signification des valeurs que peut prendre une estimation, comme l'intervalle 0-1, l'échelle CVSS de 0 à 10 ou une échelle ordinale à cinq niveaux.","mod":"measure","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":["CRG risk units","CVSS base score 0-10","five-point ordinal 1-5","unit interval 0-1"]},{"id":"CRGO_0000039","en":"screening score","fr":"score de présélection","den":"An estimate scoring a candidate scenario from 1 to 5 on one screening criterion.","dfr":"Estimation qui note un scénario candidat de 1 à 5 selon un critère de présélection.","mod":"crg","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000040","en":"CRG parameter","fr":"paramètre CRG","den":"An estimate of one of the CyberRiskGuardian input parameters of a scenario, on the 0-1 scale, for the assessment horizon (12 months by default).","dfr":"Estimation d'un des paramètres d'entrée CyberRiskGuardian d'un scénario, sur l'échelle de 0 à 1, pour l'horizon de l'appréciation (12 mois par défaut).","mod":"crg","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000041","en":"threat presence Pb(A)","fr":"présence de la menace Pb(A)","den":"A CRG parameter estimating the probability that the scenario's threat event is attempted or occurs during the horizon.","dfr":"Paramètre CRG qui estime la probabilité que l'événement de menace du scénario soit tenté ou se produise pendant l'horizon.","mod":"crg","parents":["CRGO_0000040","CRGO_0000297"],"bucket":"ice","values":[]},{"id":"CRGO_0000042","en":"probability of exploitation Pb(ψ,A)","fr":"probabilité d'exploitation Pb(ψ,A)","den":"A CRG parameter estimating the probability that the threat exploits the scenario's vulnerability or condition, given the controls in place.","dfr":"Paramètre CRG qui estime la probabilité que la menace exploite la vulnérabilité ou la condition du scénario, compte tenu des contrôles en place.","mod":"crg","parents":["CRGO_0000040","CRGO_0000297"],"bucket":"ice","values":[]},{"id":"CRGO_0000043","en":"expected damage δe","fr":"dommage attendu δe","den":"A CRG parameter estimating, on 0-1, the damage expected if the scenario occurs.","dfr":"Paramètre CRG qui estime, sur 0-1, le dommage attendu si le scénario se réalise.","mod":"crg","parents":["CRGO_0000040","CRGO_0000298"],"bucket":"ice","values":[]},{"id":"CRGO_0000044","en":"maximum damage δm","fr":"dommage maximal δm","den":"A CRG parameter estimating, on 0-1, the damage in a plausible worst case if the scenario occurs.","dfr":"Paramètre CRG qui estime, sur 0-1, le dommage dans le pire cas plausible si le scénario se réalise.","mod":"crg","parents":["CRGO_0000040","CRGO_0000298"],"bucket":"ice","values":[]},{"id":"CRGO_0000045","en":"organisational resilience θ","fr":"résilience organisationnelle θ","den":"A CRG parameter estimating, on (0, 1], the organisation's ability to withstand and recover from the scenario; higher means stronger.","dfr":"Paramètre CRG qui estime, sur ]0, 1], la capacité de l'organisation à résister au scénario et à s'en remettre; une valeur plus élevée signifie une meilleure résilience.","mod":"crg","parents":["CRGO_0000040"],"bucket":"ice","values":[]},{"id":"CRGO_0000046","en":"scenario criticality μ(E)","fr":"criticité du scénario μ(E)","den":"A CRG parameter estimating, on 0-1, the strategic importance to the organisation of the assets and processes at risk in the scenario.","dfr":"Paramètre CRG qui estime, sur 0-1, l'importance stratégique pour l'organisation des actifs et processus exposés dans le scénario.","mod":"crg","parents":["CRGO_0000040"],"bucket":"ice","values":[]},{"id":"CRGO_0000047","en":"probability reduction","fr":"réduction de probabilité","den":"A CRG parameter estimating, on 0-1, how much the scenario's treatment package reduces its probability.","dfr":"Paramètre CRG qui estime, sur 0-1, la réduction de probabilité apportée par l'ensemble des traitements du scénario.","mod":"crg","parents":["CRGO_0000040"],"bucket":"ice","values":[]},{"id":"CRGO_0000048","en":"impact reduction","fr":"réduction d'impact","den":"A CRG parameter estimating, on 0-1, how much the scenario's treatment package reduces its impact.","dfr":"Paramètre CRG qui estime, sur 0-1, la réduction d'impact apportée par l'ensemble des traitements du scénario.","mod":"crg","parents":["CRGO_0000040"],"bucket":"ice","values":[]},{"id":"CRGO_0000049","en":"CVSS input","fr":"donnée CVSS","den":"An estimate recording the CVSS version, vector, base score and severity of the representative weakness of a scenario, with a note when CVSS has limited applicability.","dfr":"Estimation qui consigne la version, le vecteur, le score de base et la sévérité CVSS de la faiblesse représentative d'un scénario, avec une note lorsque CVSS s'applique mal.","mod":"crg","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000050","en":"risk index","fr":"indice de risque","den":"An estimate computed by the CRG formulas from a scenario's parameters, such as estimated, tolerated, mitigated or residual risk or the risk-to-tolerance ratio: a relative, dimensionless decision-support value, not a prediction of loss. It is not a key risk indicator, which is a measured monitoring value.","dfr":"Estimation calculée par les formules CRG à partir des paramètres d'un scénario, comme le risque estimé, toléré, atténué ou résiduel ou le ratio risque/tolérance : une valeur relative et sans dimension d'aide à la décision, et non une prévision de perte. Ce n'est pas un indicateur clé de risque, qui est une valeur de surveillance mesurée.","mod":"crg","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000051","en":"estimated risk Re","fr":"risque estimé Re","den":"A computed risk quantity equal to Pb(A) × Pb(ψ,A) × CVSS × ((δe + δm)/2) × μ(E) ÷ θ × factor.","dfr":"Quantité de risque calculée égale à Pb(A) × Pb(ψ,A) × CVSS × ((δe + δm)/2) × μ(E) ÷ θ × facteur.","mod":"crg","parents":["CRGO_0000050","CRGO_0000299"],"bucket":"ice","values":[]},{"id":"CRGO_0000052","en":"tolerated risk Rt","fr":"risque toléré Rt","den":"A computed risk quantity equal to Pb(A) × Pb(ψ,A) × CVSS × appetite × μ(E) ÷ θ × factor.","dfr":"Quantité de risque calculée égale à Pb(A) × Pb(ψ,A) × CVSS × appétit pour le risque × μ(E) ÷ θ × facteur.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000053","en":"mitigated risk (risk removed)","fr":"réduction du risque obtenue","den":"A computed risk quantity equal to estimated risk × probability reduction × impact reduction.","dfr":"Quantité de risque calculée, égale au risque estimé × réduction de probabilité × réduction d'impact, qui représente la part du risque retirée par le traitement.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000054","en":"residual risk","fr":"risque résiduel","den":"A computed risk quantity equal to estimated risk minus mitigated risk.","dfr":"Quantité de risque calculée égale au risque estimé moins le risque atténué.","mod":"crg","parents":["CRGO_0000050","CRGO_0000299"],"bucket":"ice","values":[]},{"id":"CRGO_0000055","en":"risk-to-tolerance ratio","fr":"ratio risque/tolérance","den":"A computed risk quantity equal to residual risk divided by tolerated risk; below 0.90 is below tolerance and above 1.10 is above tolerance.","dfr":"Quantité de risque calculée égale au risque résiduel divisé par le risque toléré; sous 0,90 le risque est sous la tolérance et au-dessus de 1,10 il la dépasse.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000056","en":"cost-effectiveness","fr":"rapport coût-efficacité","den":"A computed risk quantity equal to (estimated risk − residual risk) ÷ treatment cost × 1,000, the risk units removed per $1,000; the cost basis (first-year, annual or multi-year) is stated with the value.","dfr":"Quantité de risque calculée égale à (risque estimé − risque résiduel) ÷ coût du traitement × 1 000, soit les unités de risque retirées par tranche de 1 000 $.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000057","en":"legacy computed risk quantity","fr":"quantité de risque calculée (héritée)","den":"A computed risk quantity produced by the 2023 scenario-generator notebook, kept for traceability but not comparable with CRG v1.0c results.","dfr":"Quantité de risque calculée produite par le carnet de génération de scénarios de 2023, conservée pour la traçabilité mais non comparable aux résultats CRG v1.0c.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000058","en":"calculation activity","fr":"activité de calcul","den":"A process in which software computes risk quantities from estimates using a stated method, such as a run of crg_calc.py.","dfr":"Processus par lequel un logiciel calcule des quantités de risque à partir d'estimations selon une méthode déclarée, comme une exécution de crg_calc.py.","mod":"crg","parents":["http://purl.obolibrary.org/obo/BFO_0000015"],"bucket":"process","values":[]},{"id":"CRGO_0000059","en":"calculation method","fr":"méthode de calcul","den":"An algorithm, identified with its version, that specifies how risk quantities are computed from estimates.","dfr":"Algorithme, identifié avec sa version, qui précise comment les quantités de risque sont calculées à partir des estimations.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000653"],"bucket":"ice","values":["CRGO_0000178","CRGO_0000179","CRGO_0000180"]},{"id":"CRGO_0000060","en":"sensitivity case","fr":"cas de sensibilité","den":"A description of a variant of a scenario's estimates (lower, central or higher) used to test whether its tolerance classification changes.","dfr":"Description d'une variante des estimations d'un scénario (basse, centrale ou haute) servant à vérifier si sa classification par rapport à la tolérance change.","mod":"crg","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000061","en":"confidence level","fr":"niveau de confiance","den":"A level of confidence in an estimate or in a proposed ontology element.","dfr":"Niveau de confiance dans une estimation ou dans un élément d'ontologie proposé.","mod":"gov","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["high confidence","low confidence","medium confidence"]},{"id":"CRGO_0000066","en":"governance status","fr":"statut de gouvernance","den":"The approval state of an ontology element or data item.","dfr":"État d'approbation d'un élément d'ontologie ou d'une donnée.","mod":"gov","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["approved","deprecated","proposed","rejected"]},{"id":"CRGO_0000072","en":"impact dimension","fr":"dimension d'impact","den":"A dimension along which a consequence affects the organisation.","dfr":"Dimension selon laquelle une conséquence touche l'organisation.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["availability","confidentiality","financial","integrity","legal and regulatory","operational","privacy","reputation","safety","strategic"]},{"id":"CRGO_0000084","en":"requirement level","fr":"niveau d'exigence","den":"A level of confidentiality, integrity or availability requirement placed on an asset.","dfr":"Niveau d'exigence de confidentialité, d'intégrité ou de disponibilité attribué à un actif.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["high requirement","low requirement","moderate requirement","very high requirement"]},{"id":"CRGO_0000090","en":"threat source type","fr":"type de source de menace","den":"A category of threat source following NIST SP 800-30.","dfr":"Catégorie de source de menace selon NIST SP 800-30.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["accidental","adversarial","environmental","structural"]},{"id":"CRGO_0000096","en":"control status","fr":"statut de contrôle","den":"The implementation state of a control measure in an organisation.","dfr":"État de mise en œuvre d'une mesure de contrôle dans une organisation.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["in place","planned","proposed (control)"]},{"id":"CRGO_0000101","en":"risk stage","fr":"stade du risque","den":"Whether an estimate applies before or after treatment.","dfr":"Indique si une estimation s'applique avant ou après le traitement.","mod":"measure","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["inherent","residual"]},{"id":"CRGO_0000105","en":"tolerance classification","fr":"classification par rapport à la tolérance","den":"The CRG reading of a risk-to-tolerance ratio.","dfr":"Lecture CRG d'un ratio risque/tolérance.","mod":"crg","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["above tolerance","approximately at tolerance","below tolerance"]},{"id":"CRGO_0000110","en":"selection disposition","fr":"décision de présélection","den":"The outcome of screening a candidate scenario.","dfr":"Résultat de la présélection d'un scénario candidat.","mod":"crg","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["consolidated","deferred","selected","under consideration"]},{"id":"CRGO_0000116","en":"evidence basis","fr":"fondement de la preuve","den":"The kind of support behind an assertion, following the CRG evidence register.","dfr":"Nature de l'appui d'une affirmation, selon le registre de preuves CRG.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["AI estimate requiring validation","analyst inference","documented evidence","exercise or simulation evidence","expert input","external evidence"]},{"id":"CRGO_0000123","en":"sensitivity case type","fr":"type de cas de sensibilité","den":"The direction of a CRG sensitivity shift.","dfr":"Sens d'une variation de sensibilité CRG.","mod":"crg","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["central case","higher case","lower case"]},{"id":"CRGO_0000128","en":"initiative priority","fr":"priorité d'initiative","den":"The urgency class of a treatment initiative in CRG.","dfr":"Classe d'urgence d'une initiative de traitement dans CRG.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["immediate","near-term","scheduled later"]},{"id":"CRGO_0000133","en":"control function","fr":"fonction de contrôle","den":"The function a control or initiative serves in the treatment portfolio.","dfr":"Fonction qu'un contrôle ou une initiative remplit dans le portefeuille de traitement.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["detection","governance","prevention","recovery","resilience","response"]},{"id":"CRGO_0000141","en":"treatment option","fr":"option de traitement","den":"One of the generic ways to treat a risk.","dfr":"L'une des façons génériques de traiter un risque.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["risk avoidance","risk modification","risk retention","risk sharing"]},{"id":"CRGO_0000147","en":"screening criterion","fr":"critère de présélection","den":"One of the 12 CRG criteria used to score candidate scenarios.","dfr":"L'un des 12 critères CRG servant à noter les scénarios candidats.","mod":"crg","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["asset criticality","business criticality","control uncertainty","decision usefulness","dependency / concentration","evidence strength","exposure / vulnerability","operational resilience","potential impact","regulatory / legal","risk velocity","threat relevance"]},{"id":"CRGO_0000161","en":"escalation flag","fr":"signal d'escalade","den":"A CRG flag that keeps a candidate scenario in review regardless of low probability.","dfr":"Signal CRG qui maintient un scénario candidat à l'étude malgré une faible probabilité.","mod":"crg","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["backup or recovery destruction","catastrophic data loss","essential service","existential financial","major regulatory","multi-unit or multi-jurisdiction","privileged infrastructure","safety escalation","severe privacy","supply-chain concentration","systemic failure"]},{"id":"CRGO_0000294","en":"threat source description","fr":"description de source de menace","den":"A description of a kind of threat source, such as a financially motivated cybercriminal, a negligent employee or a flood, with its type, used when the source is not an identified agent or process.","dfr":"Description d'un type de source de menace, comme un cybercriminel motivé par l'appât du gain, un employé négligent ou une inondation, avec son type, utilisée lorsque la source n'est pas un agent ou un processus identifié.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000295","en":"vulnerability description","fr":"description de vulnérabilité","den":"A description of a kind of weakness or predisposing condition, including weaknesses of software, information and controls, that a threat event can exploit.","dfr":"Description d'un type de faiblesse ou de condition prédisposante, y compris les faiblesses des logiciels, de l'information et des contrôles, qu'un événement de menace peut exploiter.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000296","en":"framework","fr":"référentiel","den":"A published standard, framework, law or catalogue whose requirements are held as a concept scheme, identified with its version, such as NIST CSF 2.0 or ISO/IEC 27002:2022.","dfr":"Norme, référentiel, loi ou catalogue publié dont les exigences sont consignées dans un schéma de concepts, identifié avec sa version, comme NIST CSF 2.0 ou ISO/IEC 27002:2022.","mod":"core","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000297","en":"likelihood","fr":"vraisemblance","den":"An estimate of how likely a threat event or its success is over a stated period, on any scale.","dfr":"Estimation de la probabilité qu'un événement de menace se produise ou réussisse au cours d'une période donnée, sur toute échelle.","mod":"measure","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000298","en":"impact estimate","fr":"estimation de l'impact","den":"An estimate of the magnitude of a scenario's consequences, on any scale.","dfr":"Estimation de l'ampleur des conséquences d'un scénario, sur toute échelle.","mod":"measure","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000299","en":"risk level","fr":"niveau de risque","den":"An estimate of the magnitude of a risk, combining likelihood and impact by a stated method.","dfr":"Estimation de l'ampleur d'un risque, qui combine vraisemblance et impact selon une méthode déclarée.","mod":"measure","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000300","en":"control effectiveness","fr":"efficacité du contrôle","den":"An estimate of how well a control measure achieves its intended reduction of likelihood or impact, with the evidence for it.","dfr":"Estimation du degré auquel une mesure de contrôle atteint la réduction de vraisemblance ou d'impact visée, avec les preuves à l'appui.","mod":"measure","parents":["CRGO_0000037"],"bucket":"ice","values":[]},{"id":"CRGO_0000301","en":"pre-treatment ratio","fr":"ratio avant traitement","den":"A computed risk quantity equal to estimated risk divided by tolerated risk, before any treatment.","dfr":"Quantité de risque calculée égale au risque estimé divisé par le risque toléré, avant tout traitement.","mod":"crg","parents":["CRGO_0000050"],"bucket":"ice","values":[]},{"id":"CRGO_0000302","en":"asset category","fr":"catégorie d'actif","den":"A kind of asset named in a scenario that belongs to no particular organisation.","dfr":"Type d'actif nommé dans un scénario qui n'appartient à aucune organisation en particulier.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["OT, IoT and connected devices","applications and software","cloud and third-party services","endpoints","facilities","identity and access systems","information assets","infrastructure","networks and communications","people and key personnel"]},{"id":"CRGO_0000314","en":"asset tier","fr":"rang d'actif","den":"Whether an asset is primary or supporting for a given process.","dfr":"Indique si un actif est principal ou de soutien pour un processus donné.","mod":"core","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["primary asset","supporting asset"]},{"id":"CRGO_0000337","en":"source record","fr":"notice de source","den":"A description of a dataset, publication or legal text from which CRGO content was imported or derived, recording its issuer, official identifier, version, retrieval date, licence, what CRGO redistributes and the checksum of the file used.","dfr":"Description d'un jeu de données, d'une publication ou d'un texte juridique dont un contenu de CRGO est importé ou dérivé, indiquant son émetteur, son identifiant officiel, sa version, sa date d'obtention, sa licence, ce que CRGO en rediffuse et l'empreinte du fichier utilisé.","mod":"evidence","parents":["http://www.w3.org/ns/prov#Entity","https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000338","en":"observation","fr":"observation","den":"A dated record that a stated source reported a value or category for an entity at a stated time, such as the EPSS score of a vulnerability on a given day. An observation reports what a source said; it is not an estimate made for an assessment.","dfr":"Enregistrement daté indiquant qu'une source donnée a rapporté une valeur ou une catégorie pour une entité à un moment donné, comme le score EPSS d'une vulnérabilité un jour donné. Une observation rapporte ce qu'une source a dit; ce n'est pas une estimation faite pour une appréciation.","mod":"evidence","parents":["http://www.w3.org/ns/prov#Entity","https://www.commoncoreontologies.org/ont00001163"],"bucket":"ice","values":[]},{"id":"CRGO_0000339","en":"assumption","fr":"hypothèse","den":"A statement taken as true without verification for an estimate, an assessment or a decision, recorded so that the result can be reviewed when the statement turns out to be false or changes.","dfr":"Énoncé tenu pour vrai sans vérification aux fins d'une estimation, d'une appréciation ou d'une décision, consigné afin que le résultat puisse être revu si l'énoncé se révèle faux ou change.","mod":"evidence","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000340","en":"EPSS observation","fr":"observation EPSS","den":"An observation of the Exploit Prediction Scoring System score of a published vulnerability on a given day: FIRST's estimated probability that the vulnerability is exploited in the wild in the following 30 days, with its percentile among all scored vulnerabilities. It concerns the vulnerability in general, not its presence in any organisation, and it is not the likelihood of a risk scenario.","dfr":"Observation du score de l'Exploit Prediction Scoring System d'une vulnérabilité publiée un jour donné : la probabilité, estimée par FIRST, que la vulnérabilité soit exploitée dans les 30 jours suivants, avec son centile parmi toutes les vulnérabilités évaluées. Elle porte sur la vulnérabilité en général, non sur sa présence dans une organisation, et ce n'est pas la vraisemblance d'un scénario de risque.","mod":"vuln","parents":["CRGO_0000338"],"bucket":"ice","values":[]},{"id":"CRGO_0000341","en":"processing activity","fr":"activité de traitement","den":"A business process, or part of one, in which an organisation collects, uses, discloses, keeps or destroys personal information for stated purposes.","dfr":"Processus d'affaires, ou partie de processus, dans lequel une organisation recueille, utilise, communique, conserve ou détruit des renseignements personnels à des fins déterminées.","mod":"org","parents":["CRGO_0000009"],"bucket":"process","values":[]},{"id":"CRGO_0000342","en":"supplier role","fr":"rôle de fournisseur","den":"A role of an organisation that supplies goods, services or the operation of assets to another organisation, which comes to depend on it.","dfr":"Rôle d'une organisation qui fournit des biens, des services ou l'exploitation d'actifs à une autre organisation, laquelle en vient à en dépendre.","mod":"org","parents":["http://purl.obolibrary.org/obo/BFO_0000023"],"bucket":"role","values":[]},{"id":"CRGO_0000343","en":"legal instrument","fr":"instrument juridique","den":"A statute, regulation, regulatory guideline, directive to be transposed or binding contract taken as a whole, identified by its official citation or reference, with its jurisdiction and the dates of its publication, coming into force, application and consolidation. Its provisions are the concepts of the corresponding CRGO vocabulary or, for an organisation's contracts, its own clauses.","dfr":"Loi, règlement, ligne directrice réglementaire, directive à transposer ou contrat contraignant pris dans son ensemble, identifié par sa citation officielle ou sa référence, avec sa juridiction et les dates de sa publication, de son entrée en vigueur, de sa prise d'effet et de sa mise à jour. Ses dispositions sont les concepts du vocabulaire CRGO correspondant ou, pour les contrats d'une organisation, leurs propres clauses.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000344","en":"applicability condition","fr":"condition d'applicabilité","den":"A description of a condition under which a legal instrument, one of its provisions or a policy statement applies to an organisation or part of it, such as its territory, organisation type, sector, role in processing personal information, a threshold or, for a policy statement, a role or asset category, written as a CRGO paraphrase or the organisation's own wording, with its citation and a machine-readable test.","dfr":"Description d'une condition à laquelle un instrument juridique, l'une de ses dispositions ou un énoncé de politique s'applique à une organisation ou à une partie de celle-ci, comme son territoire, son type d'organisation, son secteur, son rôle dans le traitement de renseignements personnels, un seuil ou, pour un énoncé de politique, un rôle ou une catégorie d'actifs, rédigée comme une paraphrase de CRGO ou dans les termes de l'organisation, avec sa citation et un test lisible par machine.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000345","en":"applicability assessment","fr":"évaluation de l'applicabilité","den":"A dated record (not the act of assessing) of whether a legal instrument, provision or policy statement applies to a given organisation or part of it, giving the state reached (applicable, not applicable, potentially applicable or unknown) and the conditions found met, not met or undetermined.","dfr":"Enregistrement daté indiquant si un instrument juridique, une disposition ou un énoncé de politique s'applique à une organisation donnée ou à une partie de celle-ci, avec l'état retenu (applicable, non applicable, potentiellement applicable ou inconnu) et les conditions jugées remplies, non remplies ou indéterminées.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000346","en":"compliance determination","fr":"constat de conformité","den":"A dated record, made by an identified assessor, of the extent to which a given organisation satisfies a legal provision or obligation, a contractual obligation or a requirement of a framework it has adopted, with the evidence relied on or an explicit statement of the missing evidence. A mapped control or framework requirement is not by itself evidence of compliance.","dfr":"Enregistrement daté, établi par un évaluateur identifié, du degré auquel une organisation donnée satisfait à une disposition ou à une obligation légale, à une obligation contractuelle ou à une exigence d'un référentiel qu'elle a adopté, avec les preuves retenues ou un énoncé explicite des preuves manquantes. Un contrôle ou une exigence de référentiel mis en correspondance ne constitue pas à lui seul une preuve de conformité.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000347","en":"control assessment","fr":"évaluation d'une mesure de sécurité","den":"A planned act in which an assessor tests or reviews a control measure of an organisation at a stated date, over a stated scope and by a stated procedure, and records its result and the evidence gathered.","dfr":"Acte planifié par lequel un évaluateur teste ou examine une mesure de sécurité d'une organisation à une date, sur un périmètre et selon une procédure donnés, et en consigne le résultat et les preuves recueillies.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000348","en":"jurisdiction","fr":"juridiction","den":"A territory whose law or regulator CRGO's legal vocabularies come from, used to state where an organisation is established, offers services or has data subjects.","dfr":"Territoire dont proviennent le droit ou l'autorité de réglementation des vocabulaires juridiques de CRGO, servant à indiquer où une organisation est établie, offre des services ou compte des personnes concernées.","mod":"org","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["British Columbia or Alberta","Canada (federal legal order)","Canadian province or territory without substantially similar privacy law","European Union","Québec","other country"]},{"id":"CRGO_0000355","en":"organisation type","fr":"type d'organisation","den":"The legal category of an organisation that decides which privacy and security regime binds it.","dfr":"Catégorie juridique d'une organisation qui détermine le régime de protection et de sécurité qui la lie.","mod":"org","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["enterprise (private sector)","federal work, undertaking or business","federally regulated financial institution","health and social services body (Québec)","public body (Québec)"]},{"id":"CRGO_0000362","en":"processing role","fr":"rôle dans le traitement","den":"The role an organisation plays in a processing activity.","dfr":"Rôle d'une organisation dans une activité de traitement.","mod":"org","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["controller","processor or service provider"]},{"id":"CRGO_0000366","en":"personal data category","fr":"catégorie de renseignements personnels","den":"A category of personal information that a processing activity handles, used for applicability conditions and sensitivity.","dfr":"Catégorie de renseignements personnels traitée par une activité de traitement, utilisée pour les conditions d'applicabilité et la sensibilité.","mod":"org","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["biometric data","data about minors","financial and payment data","government identifiers","health data","identity and contact data","location data","online identifiers"]},{"id":"CRGO_0000376","en":"instrument kind","fr":"type d'instrument","den":"The kind of a legal instrument.","dfr":"Type d'un instrument juridique.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["contract","directive (to be transposed)","regulation","regulatory guideline","statute"]},{"id":"CRGO_0000381","en":"applicability state","fr":"état d'applicabilité","den":"The result of evaluating whether an instrument or provision applies to an organisation.","dfr":"Résultat de l'évaluation de l'applicabilité d'un instrument ou d'une disposition à une organisation.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["applicable","not applicable","potentially applicable","unknown"]},{"id":"CRGO_0000387","en":"compliance state","fr":"état de conformité","den":"The result of a compliance determination.","dfr":"Résultat d'un constat de conformité.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["not assessed","partially satisfied","satisfied","undetermined","unsatisfied"]},{"id":"CRGO_0000394","en":"condition kind","fr":"type de condition","den":"The kind of fact an applicability condition tests.","dfr":"Type de fait que vérifie une condition d'applicabilité.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["asset-category condition","data category","exception","organisation-type condition","processing","role condition","territorial"]},{"id":"CRGO_0000401","en":"control test result","fr":"résultat d'évaluation d'une mesure","den":"The result recorded by a control assessment.","dfr":"Résultat consigné par une évaluation de mesure de sécurité.","mod":"grc","parents":["http://www.w3.org/2004/02/skos/core#Concept"],"bucket":"concept","values":["effective","ineffective","not tested","partly effective"]},{"id":"CRGO_0000475","en":"analytical hypothesis","fr":"hypothèse explicative","den":"A proposed explanation, such as a suspected cause of a control failure, recorded so that it can be tested against evidence. Until it is tested it is not a fact or a conclusion.","dfr":"Explication proposée, comme la cause présumée de la défaillance d'une mesure, consignée afin d'être vérifiée au regard des preuves. Tant qu'elle n'est pas vérifiée, ce n'est ni un fait ni une conclusion.","mod":"evidence","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000476","en":"estimate distribution","fr":"distribution d'une estimation","den":"A description of the probability distribution that expresses the uncertainty of an estimate, giving its family (for example triangular or lognormal) and its parameters.","dfr":"Description de la loi de probabilité qui exprime l'incertitude d'une estimation, indiquant sa famille (par exemple triangulaire ou lognormale) et ses paramètres.","mod":"evidence","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000477","en":"analytical result","fr":"résultat analytique","den":"A record of a result computed outside CRGO by a named model and version, such as a CyberRiskGuardian risk calculation, with the inputs it used and when it was computed. CRGO stores it as a proposed risk estimate and never derives it by reasoning.","dfr":"Enregistrement d'un résultat calculé hors de CRGO par un modèle et une version nommés, comme un calcul de risque de CyberRiskGuardian, avec les données d'entrée utilisées et la date du calcul. CRGO le conserve comme estimation de risque proposée et ne le déduit jamais par raisonnement.","mod":"evidence","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000478","en":"governing body","fr":"organe de gouvernance","den":"A group of persons with ultimate accountability for directing and overseeing an organisation, such as a board of directors or a board of trustees.","dfr":"Groupe de personnes ayant la responsabilité ultime de diriger et de surveiller une organisation, comme un conseil d'administration ou un conseil des fiduciaires.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000300"],"bucket":"material","values":[]},{"id":"CRGO_0000479","en":"governance committee","fr":"comité de gouvernance","den":"A group of persons to which a governing body delegates the oversight of a defined area, such as audit, risk or compliance.","dfr":"Groupe de personnes auquel un organe de gouvernance délègue la surveillance d'un domaine défini, comme l'audit, les risques ou la conformité.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000300"],"bucket":"material","values":[]},{"id":"CRGO_0000480","en":"audit committee","fr":"comité d'audit","den":"A governance committee that oversees internal and external audit, financial reporting and the system of internal control.","dfr":"Comité de gouvernance qui surveille l'audit interne et externe, l'information financière et le système de contrôle interne.","mod":"governance","parents":["CRGO_0000479"],"bucket":"material","values":[]},{"id":"CRGO_0000481","en":"risk committee","fr":"comité des risques","den":"A governance committee that oversees risk appetite, risk exposure and the risk management framework.","dfr":"Comité de gouvernance qui surveille l'appétence pour le risque, l'exposition au risque et le cadre de gestion des risques.","mod":"governance","parents":["CRGO_0000479"],"bucket":"material","values":[]},{"id":"CRGO_0000482","en":"governance role","fr":"rôle de gouvernance","den":"A role that an agent bears within an organisation's governance, risk management, control or assurance arrangements, and that can be assigned and withdrawn without the agent changing.","dfr":"Rôle qu'un agent assume dans les dispositifs de gouvernance, de gestion des risques, de contrôle ou d'assurance d'une organisation, et qui peut être attribué ou retiré sans que l'agent change.","mod":"governance","parents":["http://purl.obolibrary.org/obo/BFO_0000023"],"bucket":"role","values":[]},{"id":"CRGO_0000483","en":"governing body member role","fr":"rôle de membre d'un organe de gouvernance","den":"The role of a person who sits on a governing body or one of its committees.","dfr":"Rôle d'une personne qui siège à un organe de gouvernance ou à l'un de ses comités.","mod":"governance","parents":["CRGO_0000482"],"bucket":"role","values":[]},{"id":"CRGO_0000484","en":"first-line role","fr":"rôle de première ligne","den":"A management role that owns and manages risk in delivering products, services and operations, including designing and operating controls.","dfr":"Rôle de gestion qui assume et gère le risque dans la prestation des produits, des services et des opérations, y compris la conception et le fonctionnement des mesures de contrôle.","mod":"governance","parents":["CRGO_0000482"],"bucket":"role","values":[]},{"id":"CRGO_0000485","en":"second-line role","fr":"rôle de deuxième ligne","den":"A management role that gives expertise, support, monitoring and challenge on risk-related matters, such as risk management or compliance functions.","dfr":"Rôle de gestion qui apporte expertise, soutien, surveillance et remise en question sur les questions de risque, comme les fonctions de gestion des risques ou de conformité.","mod":"governance","parents":["CRGO_0000482"],"bucket":"role","values":[]},{"id":"CRGO_0000486","en":"third-line role","fr":"rôle de troisième ligne","den":"The role of internal audit: independent and objective assurance and advice to the governing body and management on governance, risk management and control.","dfr":"Rôle de l'audit interne : assurance et conseil indépendants et objectifs donnés à l'organe de gouvernance et à la direction sur la gouvernance, la gestion des risques et le contrôle.","mod":"governance","parents":["CRGO_0000482"],"bucket":"role","values":[]},{"id":"CRGO_0000487","en":"external assurance role","fr":"rôle d'assurance externe","den":"The role of an agent outside the organisation, such as an external auditor or service auditor, that gives assurance on its governance, risk management or control.","dfr":"Rôle d'un agent extérieur à l'organisation, comme un auditeur externe ou un auditeur de services, qui donne une assurance sur sa gouvernance, sa gestion des risques ou son contrôle.","mod":"governance","parents":["CRGO_0000482"],"bucket":"role","values":[]},{"id":"CRGO_0000488","en":"chief audit executive role","fr":"rôle de responsable de l'audit interne","den":"The role of the person accountable for leading the internal audit function and reporting functionally to the governing body.","dfr":"Rôle de la personne responsable de diriger la fonction d'audit interne et relevant fonctionnellement de l'organe de gouvernance.","mod":"governance","parents":["CRGO_0000486"],"bucket":"role","values":[]},{"id":"CRGO_0000489","en":"compliance officer role","fr":"rôle de responsable de la conformité","den":"The role of the person responsible for the compliance function: identifying compliance obligations, monitoring how they are met and reporting on them.","dfr":"Rôle de la personne responsable de la fonction conformité : recenser les obligations de conformité, surveiller la façon dont elles sont respectées et en rendre compte.","mod":"governance","parents":["CRGO_0000485"],"bucket":"role","values":[]},{"id":"CRGO_0000490","en":"risk management function role","fr":"rôle de fonction de gestion des risques","den":"The role of a person or unit that maintains the risk management framework, challenges risk assessments and reports aggregate risk.","dfr":"Rôle d'une personne ou d'une unité qui tient à jour le cadre de gestion des risques, remet en question les appréciations du risque et rend compte du risque global.","mod":"governance","parents":["CRGO_0000485"],"bucket":"role","values":[]},{"id":"CRGO_0000491","en":"control owner role","fr":"rôle de propriétaire de mesure","den":"The role of the person accountable for the design and operation of a control measure.","dfr":"Rôle de la personne responsable de la conception et du fonctionnement d'une mesure de sécurité appliquée.","mod":"governance","parents":["CRGO_0000484"],"bucket":"role","values":[]},{"id":"CRGO_0000492","en":"risk owner role","fr":"rôle de propriétaire du risque","den":"The role of the person with the accountability and authority to manage a risk, including proposing its treatment or acceptance.","dfr":"Rôle de la personne qui a la responsabilité et l'autorité de gérer un risque, y compris d'en proposer le traitement ou l'acceptation.","mod":"governance","parents":["CRGO_0000484"],"bucket":"role","values":[]},{"id":"CRGO_0000493","en":"role assignment","fr":"attribution de rôle","den":"A record that an agent bears a governance role over a stated period, so that who held the role on a given date can be answered.","dfr":"Enregistrement indiquant qu'un agent assume un rôle de gouvernance pendant une période donnée, afin de pouvoir dire qui occupait le rôle à une date donnée.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000494","en":"delegation of authority","fr":"délégation de pouvoirs","den":"A directive by which an agent grants another agent authority to decide or act within a stated scope, limit and period.","dfr":"Directive par laquelle un agent accorde à un autre agent le pouvoir de décider ou d'agir dans une portée, une limite et une période données.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000495","en":"oversight activity","fr":"activité de surveillance","den":"A planned act in which a governing body, committee or senior manager reviews and challenges a report, a risk, a decision or an assurance result.","dfr":"Acte planifié par lequel un organe de gouvernance, un comité ou un cadre supérieur examine et remet en question un rapport, un risque, une décision ou un résultat d'assurance.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000228"],"bucket":"process","values":[]},{"id":"CRGO_0000496","en":"independence assessment","fr":"évaluation de l'indépendance","den":"A dated record of whether an assessor or assurance function is independent and objective with respect to the activity it assesses, with the threats to independence considered.","dfr":"Enregistrement daté indiquant si un évaluateur ou une fonction d'assurance est indépendant et objectif à l'égard de l'activité qu'il évalue, avec les menaces à l'indépendance examinées.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000497","en":"policy","fr":"politique","den":"A directive approved by an organisation's governing body or senior management that states its intentions and rules for a domain, such as information security or privacy.","dfr":"Directive approuvée par l'organe de gouvernance ou la haute direction d'une organisation qui énonce ses intentions et ses règles pour un domaine, comme la sécurité de l'information ou la protection des renseignements personnels.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000498","en":"policy statement","fr":"énoncé de politique","den":"A single rule within a policy, stated so that compliance with it can be assessed, such as 'privileged access is reviewed every quarter'.","dfr":"Règle unique d'une politique, formulée de manière à pouvoir en évaluer le respect, comme « les accès privilégiés sont revus chaque trimestre ».","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000499","en":"technical standard","fr":"norme technique interne","den":"An internal directive that specifies mandatory technical requirements implementing one or more policy statements, such as a password or encryption standard.","dfr":"Directive interne précisant les exigences techniques obligatoires qui mettent en œuvre un ou plusieurs énoncés de politique, comme une norme de mots de passe ou de chiffrement.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000500","en":"procedure","fr":"procédure","den":"A plan that sets out the steps by which a policy statement or technical standard is carried out, by whom and when.","dfr":"Plan qui expose les étapes par lesquelles un énoncé de politique ou une norme technique est appliqué, par qui et quand.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000974"],"bucket":"ice","values":[]},{"id":"CRGO_0000501","en":"configuration baseline","fr":"configuration de référence","den":"An approved set of configuration settings that a kind of system must meet, against which deviations are detected.","dfr":"Ensemble approuvé de paramètres de configuration auquel un type de système doit se conformer et par rapport auquel les écarts sont détectés.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000502","en":"policy exception","fr":"dérogation","den":"A directive that permits a stated deviation from a policy statement, technical standard or control for a stated scope (role, asset or process) and period, approved by an identified authority and usually with compensating controls. It does not waive a legal obligation.","dfr":"Directive qui autorise un écart déterminé par rapport à un énoncé de politique, une norme technique ou une mesure, pour une portée (rôle, actif ou processus) et une période données, approuvée par une autorité identifiée et généralement assortie de mesures compensatoires. Elle ne dispense d'aucune obligation légale.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000965"],"bucket":"ice","values":[]},{"id":"CRGO_0000503","en":"compensating control","fr":"mesure compensatoire","den":"A control measure put in place because a required control is not, or not fully, implemented, intended to reduce the same risk to a comparable degree.","dfr":"Mesure appliquée mise en place parce qu'une mesure exigée n'est pas, ou pas entièrement, mise en œuvre, et destinée à réduire le même risque dans une mesure comparable.","mod":"governance","parents":["CRGO_0000020"],"bucket":"ice","values":[]},{"id":"CRGO_0000504","en":"decision record","fr":"relevé de décision","den":"A dated record of a decision taken by an identified agent on a stated subject, such as approving a policy, an exception, a risk acceptance or the closure of a finding, with its outcome and rationale.","dfr":"Enregistrement daté d'une décision prise par un agent identifié sur un objet donné, comme l'approbation d'une politique, d'une dérogation, d'une acceptation du risque ou de la clôture d'une constatation, avec son résultat et sa justification.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000505","en":"exception expiry review","fr":"revue d'échéance de dérogation","den":"A decision record made when a policy exception reaches its expiry date, deciding whether it is renewed, changed or ended.","dfr":"Relevé de décision établi lorsqu'une dérogation arrive à échéance, décidant si elle est renouvelée, modifiée ou close.","mod":"governance","parents":["CRGO_0000504"],"bucket":"ice","values":[]},{"id":"CRGO_0000506","en":"conflict-of-interest declaration","fr":"déclaration de conflit d'intérêts","den":"A dated record in which an agent declares an interest that could impair, or appear to impair, its objectivity on a stated decision or assessment.","dfr":"Enregistrement daté par lequel un agent déclare un intérêt qui pourrait compromettre, ou sembler compromettre, son objectivité à l'égard d'une décision ou d'une évaluation donnée.","mod":"governance","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000507","en":"instrument version","fr":"version d'un instrument","den":"A description of one version of a legal instrument or standard as in force or published over a stated period, such as a consolidation of a statute or an edition of a standard.","dfr":"Description d'une version d'un instrument juridique ou d'une norme telle qu'en vigueur ou publiée pendant une période donnée, comme une mise à jour d'une loi ou une édition d'une norme.","mod":"grc","parents":["https://www.commoncoreontologies.org/ont00000853"],"bucket":"ice","values":[]},{"id":"CRGO_0000508","en":"amendment","fr":"modification","den":"A legal act or publication that changes the text of an instrument, producing a new version from a stated date
